<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七上公民｜第4～6課 互動講義</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mud:#8B7355;
    --reed:#C4A882;
    --tide:#4A7C7E;
    --sky:#B8D4D8;
    --soil:#2C1810;
    --paper:#F7F3EC;
    --ink:#1A1612;
    --seal:#B33A2E;
    --line: rgba(44,24,16,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    line-height:1.8;
    position:relative;
  }
  body::before{
    content:"部落 公民 家庭 校園";
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    font-family:"Noto Serif TC",serif;
    font-size:9vw;
    font-weight:900;
    color:var(--mud);
    opacity:0.045;
    white-space:nowrap;
    pointer-events:none;
    z-index:0;
  }
  header{
    padding:44px 20px 28px;
    text-align:center;
    border-bottom:0.5px solid var(--line);
    position:relative;
    z-index:1;
  }
  header h1{
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:clamp(26px,4vw,40px);
    margin:0 0 8px;
    letter-spacing:2px;
  }
  header p{
    margin:0;
    color:var(--mud);
    font-size:14px;
    letter-spacing:3px;
  }

  nav{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(247,243,236,0.96);
    backdrop-filter:blur(6px);
    border-bottom:0.5px solid var(--line);
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
    padding:12px 10px;
  }
  nav button{
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:14px;
    padding:9px 18px;
    border-radius:999px;
    border:0.5px solid var(--mud);
    background:transparent;
    color:var(--soil);
    cursor:pointer;
    transition:.25s;
    letter-spacing:1px;
  }
  nav button.active{
    background:var(--tide);
    border-color:var(--tide);
    color:#fff;
  }
  nav button:hover{ border-color:var(--tide); }

  main{
    max-width:880px;
    margin:0 auto;
    padding:30px 18px 100px;
    position:relative;
    z-index:1;
  }
  .section{ display:none; animation:fade .35s ease; }
  .section.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .lesson-title{
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:24px;
    color:var(--soil);
    border-left:6px solid var(--tide);
    padding-left:14px;
    margin:36px 0 6px;
  }
  .lesson-sub{
    color:var(--mud);
    font-size:13px;
    margin:0 0 20px 20px;
    letter-spacing:1px;
  }

  .notes-toggle{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    font-family:"Noto Serif TC"; font-weight:700; color:var(--soil);
    background:var(--sky); border:0.5px solid var(--tide);
    border-radius:999px; padding:8px 18px; margin-bottom:14px; width:fit-content;
    font-size:14px; letter-spacing:1px; user-select:none;
  }
  .notes-toggle .arrow{ transition:.25s; display:inline-block; }
  .notes-toggle.open .arrow{ transform:rotate(90deg); }

  .notes-wrap{ max-height:0; overflow:hidden; transition:max-height .4s ease; }
  .notes-wrap.open{ max-height:6000px; }

  .notes-block{
    background:#fff; border:0.5px solid var(--line); border-radius:12px;
    padding:6px 24px 20px; margin-bottom:22px;
  }
  .note-card{ padding:16px 0; border-bottom:0.5px dashed var(--line); }
  .note-card:last-child{ border-bottom:none; }
  .note-card h3{
    font-family:"Noto Serif TC"; font-size:16.5px; color:var(--tide);
    margin:0 0 8px; display:flex; align-items:center; gap:8px;
  }
  .note-card h3::before{
    content:"◆"; color:var(--reed); font-size:12px;
  }
  .note-card ul{ margin:6px 0; padding-left:20px; }
  .note-card li{ margin-bottom:4px; font-size:14px; color:#3a2c20; }
  .note-card p{ margin:6px 0; font-size:14px; color:#3a2c20; }
  .note-card b{ color:var(--soil); }

  .note-table{
    width:100%; border-collapse:collapse; margin:10px 0; font-size:13px;
  }
  .note-table th, .note-table td{
    border:0.5px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;
  }
  .note-table th{ background:var(--paper); color:var(--soil); font-family:"Noto Serif TC"; }
  .note-table td.hl{ color:var(--tide); font-weight:700; }

  .flow-steps{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; font-size:13.5px;
  }
  .flow-steps span.step{
    background:var(--paper); border:0.5px solid var(--mud); border-radius:8px;
    padding:5px 10px; color:var(--soil);
  }
  .flow-steps span.arrow{ color:var(--reed); font-weight:700; }


  .scoreboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    border:0.5px solid var(--line);
    border-radius:10px;
    padding:14px 20px;
    margin-bottom:22px;
    font-family:"Noto Serif TC",serif;
    box-shadow:0 1px 3px rgba(44,24,16,.05);
  }
  .scoreboard .num{ color:var(--tide); font-weight:900; font-size:20px; }
  .progress-bar{
    height:6px; background:var(--sky); border-radius:6px; overflow:hidden; flex:1; margin:0 16px;
  }
  .progress-fill{ height:100%; background:var(--tide); width:0%; transition:width .4s; }
  .reset-btn{
    border:0.5px solid var(--mud); background:none; color:var(--mud);
    border-radius:999px; padding:6px 14px; cursor:pointer; font-size:12px; font-family:"Noto Sans TC";
  }

  .passage{
    background:#fff;
    border:0.5px solid var(--line);
    border-left:4px solid var(--reed);
    border-radius:8px;
    padding:18px 22px;
    margin:0 0 18px;
    font-size:14.5px;
    color:#3a2c20;
  }
  .passage b{ color:var(--soil); }

  .qcard{
    background:#fff;
    border:0.5px solid var(--line);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .qhead{
    display:flex; gap:10px; align-items:flex-start; margin-bottom:14px;
  }
  .qnum{
    flex-shrink:0;
    width:28px; height:28px; border-radius:50%;
    background:var(--soil); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif TC"; font-weight:700; font-size:13px;
  }
  .qtext{ font-weight:500; font-size:15.5px; padding-top:3px;}
  .tag{
    display:inline-block; font-size:10.5px; padding:1px 8px; border-radius:999px;
    border:0.5px solid var(--tide); color:var(--tide); margin-left:6px; vertical-align:middle;
  }
  .options{ display:flex; flex-direction:column; gap:8px; margin-left:38px; }
  .opt{
    display:flex; align-items:center; gap:10px;
    border:0.5px solid var(--line); border-radius:8px;
    padding:9px 12px; cursor:pointer; font-size:14.5px;
    transition:.2s;
  }
  .opt:hover{ border-color:var(--tide); background:rgba(184,212,216,0.15); }
  .opt input{ accent-color:var(--tide); }
  .opt.correct{ border-color:var(--tide); background:rgba(74,124,126,0.1); font-weight:700; }
  .opt.wrong{ border-color:var(--seal); background:rgba(179,58,46,0.08); text-decoration:line-through; color:#9a6b63; }

  .btnrow{ margin:14px 0 0 38px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .check-btn{
    background:var(--soil); color:#fff; border:none; border-radius:999px;
    padding:8px 20px; font-size:13px; cursor:pointer; font-family:"Noto Serif TC"; font-weight:700;
    letter-spacing:1px;
  }
  .check-btn:disabled{ opacity:.4; cursor:default; }
  .feedback{
    margin:12px 0 0 38px; padding:10px 14px; border-radius:8px; font-size:13.5px; display:none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ background:rgba(74,124,126,0.12); color:var(--tide); }
  .feedback.no{ background:rgba(179,58,46,0.08); color:var(--seal); }
  .explain{ margin-top:6px; color:#5c4a3d; font-size:13px; }

  .seal{
    position:absolute; top:14px; right:18px;
    width:56px; height:56px; border-radius:50%;
    border:3px solid var(--seal); color:var(--seal);
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif TC"; font-weight:900; font-size:14px;
    transform:rotate(-14deg) scale(0);
    opacity:0;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s;
    letter-spacing:1px;
    pointer-events:none;
  }
  .seal.show{ transform:rotate(-14deg) scale(1); opacity:0.9; }

  .final-summary{
    text-align:center; padding:26px; margin-top:10px;
    border:0.5px dashed var(--mud); border-radius:12px; display:none;
    font-family:"Noto Serif TC"; color:var(--soil);
  }
  .final-summary.show{ display:block; }
  .final-summary .big{ font-size:34px; font-weight:900; color:var(--tide); }

  footer{
    text-align:center; padding:30px; color:var(--mud); font-size:12px; letter-spacing:2px;
    border-top:0.5px solid var(--line);
  }
</style>
</head>

      <li>求助管道：<b>撥打110</b>（報警）、<b>撥打113</b>（通報）、向<b>家庭暴力及性侵害防治中心（家防中心）</b>求助。</li>
      <li>依《兒童及少年福利與權益保障法》，成年人故意對兒少犯罪，<b>可加重其刑至二分之一</b>。</li>
    </ul>`}
],
ch5:[
  {h:"5-1　校園中的權利與維護", body:`
    <p><b>學生的權利與相對責任</b></p>
    <table class="note-table">
      <tr><th>權利</th><th>內容</th><th>相對責任</th></tr>
      <tr><td>學習</td><td>受教權、學習權</td><td>不干擾其他同學的學習權</td></tr>
      <tr><td>身體自主</td><td>個人身體不受體罰、霸凌、性騷擾</td><td>不霸凌他人</td></tr>
      <tr><td>名譽和隱私</td><td>名譽權、隱私權</td><td>不辱罵他人、不擅自翻閱他人物品</td></tr>
      <tr><td>財產</td><td>財產權</td><td>不攜帶妨害教學或干擾學習的物品</td></tr>
    </table>
    <p><b>霸凌的定義：</b>有意圖且長期性地對他人做出排擠、欺負、騷擾或戲弄等行為。</p>
    <p><b>校園性騷擾處理流程</b></p>
    <div class="flow-steps">
      <span class="step">① 提出申訴（被害人／其父母／檢舉人）</span><span class="arrow">→</span>
      <span class="step">② 受理單位（學務處：教官處或訓導處）</span><span class="arrow">→</span>
      <span class="step">③ 調查輔導（學校性別平等委員會）</span><span class="arrow">→</span>
      <span class="step">④ 彙報單位（結案建檔後彙報教育主管機關）</span>
    </div>`},
  {h:"5-2　如何參與校園公共事務", body:`
    <p><b>參與校園公共事務的三種方式</b></p>
    <ul>
      <li><b>遵守共同規範</b>：制定班級公約、遵守課堂秩序，維護他人上課權利。</li>
      <li><b>學生自治</b>：成立自治組織（班會、社團）→訂定自治規範（班級公約、社團章程）→推展自治活動（舉辦社團活動）。</li>
      <li><b>民主法治養成（會議）</b>：依行政院內政部頒布的《會議規範》進行。</li>
    </ul>
    <p><b>會議角色與職責</b></p>
    <table class="note-table">
      <tr><th>角色</th><th>職責</th></tr>
      <tr><td>主席</td><td>主持會議、維持秩序、裁決權宜與秩序問題、處理提案表決並宣布結果；原則上<b>不參加表決</b></td></tr>
      <tr><td>司儀</td><td>宣達會議程序</td></tr>
      <tr><td>紀錄</td><td>詳實紀錄會議內容</td></tr>
      <tr><td>導師</td><td>站在指導立場，提示會議規則，不參與意見表決</td></tr>
    </table>
    <p><b>權宜問題 vs 秩序問題</b></p>
    <table class="note-table">
      <tr><th></th><th>權宜問題</th><th>秩序問題</th></tr>
      <tr><td>提出時機</td><td>會場緊急事件，足以影響全體／個人權益</td><td>議題程序錯誤，足以破壞議事規則</td></tr>
      <tr><td>目的</td><td>排除阻礙會議的事</td><td>改正會議進行中的錯誤</td></tr>
      <tr><td>例子</td><td>喧鬧、地震火災等</td><td>發言超範圍、發言順序錯誤</td></tr>
    </table>
    <p>★ <b>權宜問題優先於秩序問題</b>處理。</p>
    <p><b>開會流程</b></p>
    <div class="flow-steps">
      <span class="step">選出主席、司儀、紀錄</span><span class="arrow">→</span>
      <span class="step">宣布開會</span><span class="arrow">→</span>
      <span class="step">報告事項</span><span class="arrow">→</span>
      <span class="step">討論事項（提議／討論／表決）</span><span class="arrow">→</span>
      <span class="step">臨時動議</span><span class="arrow">→</span>
      <span class="step">散會</span>
    </div>
    <p><b>提案 vs 動議</b>：提案於<b>開會前</b>以<b>書面</b>提出，須一人以上<b>附署</b>；動議於<b>開會中</b>以<b>口頭</b>提出，須一人以上<b>附議</b>。</p>
    <p><b>表決同票時的處理</b>：對人表決（如選舉）→<b>抽籤決定</b>；對事表決（如提案）→<b>主席裁決</b>。</p>
    <p>結論：重視自己與他人的權利；權利不是為了個人私利，而是要培養<b>同理心</b>。</p>`}
],

function renderNotes(container, key){
  const notes = NOTES[key];
  if(!notes) return;

  const toggle = document.createElement("div");
  toggle.className = "notes-toggle";
  toggle.innerHTML = `<span class="arrow">▶</span> 課文重點整理`;
  container.appendChild(toggle);

  const wrap = document.createElement("div");
  wrap.className = "notes-wrap";
  const block = document.createElement("div");
  block.className = "notes-block";
  notes.forEach(n=>{
    const card = document.createElement("div");
    card.className = "note-card";
    card.innerHTML = `<h3>${n.h}</h3>${n.body}`;
    block.appendChild(card);
  });
  wrap.appendChild(block);
  container.appendChild(wrap);

  toggle.onclick = ()=>{
    toggle.classList.toggle("open");
    wrap.classList.toggle("open");
  };
}

/* ============ 渲染邏輯 ============ */
const tabsMeta = [
  {key:"ch4", label:"第4課　平權家庭"},
  {key:"ch5", label:"第5課　校園生活"},
  {key:"ch6", label:"第6課　部落參與"},
  {key:"final", label:"綜合情境測驗"}
];

const nav = document.getElementById("tabNav");
const main = document.getElementById("mainArea");

tabsMeta.forEach((t,i)=>{
  const b = document.createElement("button");
  b.textContent = t.label;
  b.dataset.key = t.key;
  if(i===0) b.classList.add("active");
  b.onclick = ()=> switchTab(t.key);
  nav.appendChild(b);
});

function switchTab(key){
  document.querySelectorAll("nav button").forEach(b=> b.classList.toggle("active", b.dataset.key===key));
  document.querySelectorAll(".section").forEach(s=> s.classList.toggle("active", s.id==="sec-"+key));
}

function optLabel(i){ return "ABCDE"[i]; }

function buildQuestionCard(q, idx, sectionKey, counters){
  const card = document.createElement("div");
  card.className = "qcard";

  const seal = document.createElement("div");
  seal.className = "seal";
  seal.textContent = "答對";
  card.appendChild(seal);

  const head = document.createElement("div");
  head.className = "qhead";
  const num = document.createElement("div");
  num.className = "qnum";
  num.textContent = idx+1;
  const qt = document.createElement("div");
  qt.className = "qtext";
  qt.innerHTML = q.q + (q.type==="multi" ? '<span class="tag">複選</span>' : '');
  head.appendChild(num); head.appendChild(qt);
  card.appendChild(head);

  const optsWrap = document.createElement("div");
  optsWrap.className = "options";
  const inputType = q.type==="multi" ? "checkbox" : "radio";
  const inputName = sectionKey+"-q"+idx;

  q.opts.forEach((optText, oi)=>{
    const label = document.createElement("label");
    label.className = "opt";
    label.innerHTML = `<input type="${inputType}" name="${inputName}" value="${oi}"> <span>(${optLabel(oi)}) ${optText}</span>`;
    optsWrap.appendChild(label);
  });
  card.appendChild(optsWrap);

  const btnrow = document.createElement("div");
  btnrow.className = "btnrow";
  const checkBtn = document.createElement("button");
  checkBtn.className = "check-btn";
  checkBtn.textContent = "檢查答案";
  btnrow.appendChild(checkBtn);
  card.appendChild(btnrow);

  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.innerHTML = `<div class="fbmain"></div><div class="explain">${q.exp||""}</div>`;
  card.appendChild(feedback);

  let answered = false;

  checkBtn.onclick = ()=>{
    if(answered) return;
    const inputs = optsWrap.querySelectorAll("input");
    const selected = Array.from(inputs).filter(i=>i.checked).map(i=>parseInt(i.value));
    if(selected.length===0){ return; }
    answered = true;
    checkBtn.disabled = true;

    const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
    const isCorrect = selected.length===correctArr.length && selected.every(s=>correctArr.includes(s));

    inputs.forEach(inp=>{
      const oi = parseInt(inp.value);
      const label = inp.closest(".opt");
      inp.disabled = true;
      if(correctArr.includes(oi)) label.classList.add("correct");
      else if(inp.checked) label.classList.add("wrong");
    });

    feedback.classList.add("show");
    feedback.classList.add(isCorrect ? "ok" : "no");
    feedback.querySelector(".fbmain").textContent = isCorrect ? "✓ 答對了！" : "✗ 答錯了，正確答案已標示為綠色框線。";

    if(isCorrect){
      seal.classList.add("show");
      counters.correct++;
    }
    counters.answered++;
    updateScoreboard(sectionKey, counters);
  };

  return card;
}

function updateScoreboard(sectionKey, counters){
  const sb = document.getElementById("sb-"+sectionKey);
  if(!sb) return;
  sb.querySelector(".num").textContent = counters.correct + " / " + counters.total;
  const pct = counters.total ? Math.round((counters.answered/counters.total)*100) : 0;
  sb.querySelector(".progress-fill").style.width = pct + "%";

  if(counters.answered === counters.total){
    const fs = document.getElementById("fs-"+sectionKey);
    if(fs){
      fs.classList.add("show");
      const rate = Math.round((counters.correct/counters.total)*100);
      fs.querySelector(".big").textContent = rate + "%";
      fs.querySelector(".msg").textContent = rate>=80 ? "太棒了，已充分掌握本課重點！" : (rate>=60 ? "還不錯，再複習一下錯誤的題目吧！" : "建議重新閱讀筆記後再挑戰一次！");
    }
  }
}

function resetSection(sectionKey){
  const sec = document.getElementById("sec-"+sectionKey);
  sec.remove();
  if(sectionKey==="final") renderFinal();
  else renderLesson(sectionKey);
  switchTab(sectionKey);
}

function makeScoreboard(sectionKey, total){
  const sb = document.createElement("div");
  sb.className = "scoreboard";
  sb.id = "sb-"+sectionKey;
  sb.innerHTML = `
    <span class="num">0 / ${total}</span>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <button class="reset-btn">重新測驗</button>
  `;
  sb.querySelector(".reset-btn").onclick = ()=> resetSection(sectionKey);
  return sb;
}

function makeFinalSummary(sectionKey){
  const fs = document.createElement("div");
  fs.className = "final-summary";
  fs.id = "fs-"+sectionKey;
  fs.innerHTML = `<div>本回答對率</div><div class="big">0%</div><div class="msg"></div>`;
  return fs;
}

function renderLesson(key){
  const data = DATA[key];
  const sec = document.createElement("div");
  sec.className = "section";
  sec.id = "sec-"+key;

  const h = document.createElement("div");
  h.className = "lesson-title";
  h.textContent = data.title;
  sec.appendChild(h);

  const sub = document.createElement("div");
  sub.className = "lesson-sub";
  sub.textContent = data.sub;
  sec.appendChild(sub);

  renderNotes(sec, key);

  const counters = {correct:0, answered:0, total:data.questions.length};
  sec.appendChild(makeScoreboard(key, counters.total));

  data.questions.forEach((q, idx)=>{
    sec.appendChild(buildQuestionCard(q, idx, key, counters));
  });

  sec.appendChild(makeFinalSummary(key));
  main.appendChild(sec);
}

function renderFinal(){
  const sec = document.createElement("div");
  sec.className = "section";
  sec.id = "sec-final";

  const h = document.createElement("div");
  h.className = "lesson-title";
  h.textContent = FINAL.title;
  sec.appendChild(h);

  const sub = document.createElement("div");
  sub.className = "lesson-sub";
  sub.textContent = FINAL.sub;
  sec.appendChild(sub);

  let total = 0;
  FINAL.groups.forEach(g=> total += g.questions.length);
  const counters = {correct:0, answered:0, total};
  sec.appendChild(makeScoreboard("final", total));

  let qIdx = 0;
  FINAL.groups.forEach(g=>{
    const p = document.createElement("div");
    p.className = "passage";
    p.innerHTML = "<b>閱讀情境：</b>" + g.passage;
    sec.appendChild(p);
    g.questions.forEach(q=>{
      sec.appendChild(buildQuestionCard(q, qIdx, "final", counters));
      qIdx++;
    });
  });

  sec.appendChild(makeFinalSummary("final"));
  main.appendChild(sec);
}

/* 初始渲染 */
renderLesson("ch4");
renderLesson("ch5");
renderLesson("ch6");
renderFinal();
switchTab("ch4");
</script>
