<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理｜人口・產業・聚落與交通・第二冊1-6章綜合複習測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mud:#8B7355;
    --reed:#C4A882;
    --tide:#4A7C7E;
    --sky:#B8D4D8;
    --soil:#2C1810;
    --paper:#F7F3EC;
    --ink:#1A1612;
    --muted:#6B5E52;
    --seal:#B23A2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC", sans-serif;
    line-height:1.75;
  }
  h1,h2,h3,.serif{ font-family:"Noto Serif TC", serif; }

  .watermark{
    position:fixed;
    top:2vh; right:-2vw;
    font-family:"Noto Serif TC", serif;
    font-size:38vw;
    font-weight:900;
    color:var(--soil);
    opacity:0.035;
    z-index:0;
    pointer-events:none;
    user-select:none;
  }

  header{
    position:relative;
    z-index:1;
    padding:48px 24px 28px;
    text-align:center;
    border-bottom:0.5px solid var(--mud);
  }
  header h1{
    font-size:1.7rem;
    font-weight:700;
    color:var(--soil);
    margin:0 0 8px;
    letter-spacing:0.06em;
  }
  header p{
    color:var(--muted);
    margin:0;
    font-size:0.9rem;
    letter-spacing:0.03em;
  }

  .wrap{max-width:820px;margin:0 auto;padding:0 20px 90px;position:relative;z-index:1;}

  .stats{
    display:flex; justify-content:center; gap:0;
    margin:22px auto 0; max-width:420px;
    border:0.5px solid var(--mud); border-radius:3px; overflow:hidden;
  }
  .stat{
    flex:1; text-align:center; padding:12px 8px;
    border-right:0.5px solid var(--reed);
  }
  .stat:last-child{ border-right:none; }
  .stat .num{ font-family:"Noto Serif TC", serif; font-size:1.4rem; font-weight:900; color:var(--tide); }
  .stat .lab{ font-size:0.76rem; color:var(--muted); letter-spacing:0.06em; margin-top:2px; }

  .card{
    background:#FFFFFF;
    border:0.5px solid var(--mud);
    border-radius:3px;
    padding:24px 26px;
    margin:26px 0;
    position:relative;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(44,24,16,0.04);
  }

  .qhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .qcount{
    font-family:"Noto Serif TC", serif; font-weight:900; color:var(--reed); font-size:1.15rem; letter-spacing:0.04em;
  }
  .qtag{
    font-family:"Noto Serif TC", serif; font-weight:700; font-size:0.78rem; color:var(--paper);
    background:var(--mud); padding:3px 11px; letter-spacing:0.1em; border-radius:2px; white-space:nowrap;
  }

  .progress-bar{ height:4px; background:var(--sky); border-radius:2px; overflow:hidden; margin-bottom:22px; }
  .progress-fill{ height:100%; background:var(--tide); width:0%; transition:width .3s ease; }

  .prompt{
    font-weight:500; color:var(--soil); font-size:1.02rem; margin-bottom:16px;
  }

  .data-box{ margin:10px 0 18px; overflow-x:auto; }
  .data-box table{ width:100%; border-collapse:collapse; font-size:0.86rem; }
  .data-box th, .data-box td{ border:0.5px solid var(--reed); padding:7px 10px; text-align:center; color:var(--ink); white-space:nowrap; }
  .data-box th{ background:var(--paper); color:var(--soil); font-family:"Noto Serif TC", serif; font-weight:700; font-size:0.82rem; }
  .data-caption{ font-size:0.78rem; color:var(--muted); margin:-8px 0 16px; text-align:center; }

  .options{ display:flex; flex-direction:column; gap:8px; }
  .opt-btn{
    text-align:left; background:var(--paper); border:0.5px solid var(--reed);
    border-radius:2px; padding:11px 15px; cursor:pointer; font-size:0.94rem;
    color:var(--ink); font-family:"Noto Sans TC", sans-serif; transition:all .15s ease;
  }
  .opt-btn:hover:not(:disabled){ border-color:var(--tide); }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ border-color:var(--tide); background:rgba(74,124,126,0.10); color:var(--soil); font-weight:700; }
  .opt-btn.wrong{ border-color:var(--seal); background:rgba(178,58,46,0.06); color:var(--muted); text-decoration:line-through; }
  .opt-btn.reveal{ border-color:var(--tide); background:rgba(74,124,126,0.10); color:var(--soil); font-weight:700; }

  .explain{
    margin-top:14px; font-size:0.86rem; color:var(--muted); background:var(--paper);
    border-left:3px solid var(--tide); padding:10px 13px; display:none;
  }
  .explain.show{ display:block; }
  .explain .lab{ font-weight:700; color:var(--tide); font-size:0.78rem; letter-spacing:0.1em; margin-bottom:4px; }

  .qcontrols{ display:flex; justify-content:flex-end; align-items:center; margin-top:20px; }
  .next-btn{
    background:var(--tide); color:var(--paper); border:none;
    padding:9px 26px; border-radius:2px; font-family:"Noto Serif TC", serif;
    font-weight:700; cursor:pointer; letter-spacing:0.06em; font-size:0.92rem;
  }
  .next-btn:hover:not(:disabled){ background:#3A6264; }
  .next-btn:disabled{ background:var(--sky); color:var(--muted); cursor:not-allowed; }

  .stamp{
    position:relative; display:inline-flex; align-items:center; font-family:"Noto Serif TC", serif;
    font-weight:900; font-size:1rem; border:2.5px solid var(--seal); color:var(--seal);
    border-radius:6px; padding:3px 14px; transform:rotate(-6deg); letter-spacing:0.15em;
  }
  .stamp.ok{ border-color:var(--tide); color:var(--tide); }

  .final-result{ text-align:center; padding:34px 20px; border:0.5px solid var(--tide); border-radius:3px; background:#fff; }
  .final-result .big{ font-family:"Noto Serif TC", serif; font-size:2.6rem; font-weight:900; color:var(--tide); margin-top:14px; }
  .final-result .msg{ margin-top:8px; color:var(--muted); font-size:0.92rem; }

  .section-bd{ margin-top:26px; text-align:left; }
  .bd-row{ margin-bottom:12px; }
  .bd-label{ display:flex; justify-content:space-between; font-size:0.82rem; font-weight:700; color:var(--soil); margin-bottom:5px; font-family:"Noto Serif TC", serif; }
  .bd-bar{ height:6px; border-radius:3px; background:var(--sky); overflow:hidden; }
  .bd-fill{ height:100%; background:var(--tide); border-radius:3px; transition:width .8s ease; }

  footer{
    position:relative; z-index:1; text-align:center; padding:20px;
    color:var(--muted); font-size:0.8rem; border-top:0.5px solid var(--reed);
  }

  @media (max-width:520px){
    header h1{ font-size:1.25rem; }
    .watermark{ font-size:60vw; top:6vh; }
    .card{ padding:20px 18px; }
    .prompt{ font-size:0.95rem; }
  }
</style>
</head>
<body>

<div class="watermark" id="wm">地</div>

<div class="wrap">

<header>
  <h1>地理｜第二冊 1–6 章綜合複習測驗</h1>
  <p>第一章・人口地理　　第二章・產業地理　　第三章・聚落與交通運輸</p>
  <div class="stats">
    <div class="stat"><div class="num" id="statAnswered">0</div><div class="lab">已作答</div></div>
    <div class="stat"><div class="num" id="statCorrect">0</div><div class="lab">答對題數</div></div>
    <div class="stat"><div class="num" id="statRate">—</div><div class="lab">正確率</div></div>
  </div>
</header>

<div class="card">
  <div id="intro" style="text-align:center;">
    <button class="next-btn" id="startBtn">開始作答</button>
  </div>
  <div class="qcontent" id="quizArea" style="display:none;"></div>
  <div class="final-result" id="finalResult" style="display:none;"></div>
</div>

</div>

<script>
const SECTIONS = ["人口地理","產業地理","聚落與交通"];

const QUESTIONS = [
// ===================== 一、人口地理 =====================
{sec:0, tag:"人口地理・資料判讀", q:`某鄉鎮公所調查轄內四個村里的出生率與死亡率，資料如下表所示。若不考慮人口遷移，請根據資料判斷，哪一個村里的「自然增加率」最高？
<div class="data-box"><table><thead><tr><th>村里</th><th>出生率（‰）</th><th>死亡率（‰）</th></tr></thead><tbody>
<tr><td>甲村</td><td>18</td><td>6</td></tr>
<tr><td>乙村</td><td>10</td><td>9</td></tr>
<tr><td>丙村</td><td>14</td><td>5</td></tr>
<tr><td>丁村</td><td>8</td><td>10</td></tr>
</tbody></table></div>`,
options:["甲村","乙村","丙村","丁村"], answer:0,
explain:"自然增加率＝出生率－死亡率。甲村＝18－6＝12‰，乙村＝10－9＝1‰，丙村＝14－5＝9‰，丁村＝8－10＝－2‰（負成長）。四者相比，甲村的自然增加率最高。"},

{sec:0, tag:"人口地理・人口結構", q:"某國近三十年出生率持續低迷，同時醫療進步使國民平均壽命不斷延長。若將該國的人口結構繪成人口金字塔，塔形將呈現「塔基窄、塔頂寬」的收縮型態。依此推論，該國目前最可能面臨下列哪一項人口問題？",
options:["青壯年人口過剩，就業競爭激烈","扶養比持續上升，工作年齡人口的扶養負擔加重","性別比嚴重失衡，男多於女","人口大量外移，總人口急速減少"], answer:1,
explain:"塔基窄代表幼年人口少（少子化），塔頂寬代表老年人口多（高齡化）。幼年與老年人口相對於工作年齡人口（15～64歲）的比例上升，扶養比自然隨之上升，工作年齡人口需負擔更多的扶養責任。"},

{sec:0, tag:"人口地理・扶養比計算", q:"某鄉鎮的人口統計資料顯示：15～64 歲的工作年齡人口共有 80 萬人，0～14 歲的幼年人口有 16 萬人，65 歲以上的老年人口有 24 萬人。請計算該鄉鎮的「扶養比」約為多少？",
options:["30","40","50","60"], answer:2,
explain:"扶養比＝（幼年人口＋老年人口）÷ 工作年齡人口 × 100 ＝（16 萬＋24 萬）÷ 80 萬 × 100 ＝ 40 萬 ÷ 80 萬 × 100 ＝ 50。"},

{sec:0, tag:"人口地理・性別比計算", q:"臺灣某離島地區由於青壯年男性長年在外地工作，加上部分傳統產業（如遠洋漁業）多雇用男性，使該地常住人口中男性有 12,000 人，女性有 10,000 人。請問該地區的「性別比」約為多少？",
options:["83","100","120","150"], answer:2,
explain:"性別比＝男性人口 ÷ 女性人口 × 100 ＝ 12,000 ÷ 10,000 × 100 ＝ 120，代表平均每 100 位女性對應 120 位男性。"},

{sec:0, tag:"人口地理・社會增加", q:"小安的家鄉原本只是一處人口稀少的濱海聚落，近年因政府在當地設置科技工業區，提供大量就業機會，吸引許多外地青壯年攜家帶眷遷入定居，使該地人口快速成長。此現象主要反映該地哪一項人口數值明顯上升？",
options:["出生率","死亡率","自然增加率","社會增加率"], answer:3,
explain:"人口成長的原因除了自然增加（出生率減死亡率）外，還包括「社會增加」，也就是遷入率減遷出率。題幹描述的是外地人口「遷入」定居，屬於社會增加率上升。"},

{sec:0, tag:"人口地理・新住民議題", q:"每年 4 月中旬，東南亞的柬埔寨、寮國、泰國、緬甸都會慶祝潑水節。近年來臺灣多個縣市也開始舉辦大型潑水節活動，參與者除了本地民眾，還包含許多來自上述國家、因跨國婚姻或工作而在臺定居的移工與配偶。此現象最能反映臺灣當前哪一項人口議題？",
options:["人口分布不均","少子化與人口老化","人口密度過高","新住民帶來的多元文化"], answer:3,
explain:"題幹描述的是因婚姻或工作移入臺灣的東南亞人口，將原生國的節慶文化帶入臺灣社會，屬於新住民多元文化在臺灣落地生根的現象。"},

{sec:0, tag:"人口地理・圖表判讀", q:"根據內政部移民署統計，臺灣新住民（外籍與大陸配偶）依國籍比例繪製成圓餅圖，其中「甲」國籍占全體新住民的 63%，其餘各國籍合計占 37%。依此比例判斷，「甲」最可能為下列哪一個國籍？",
options:["越南籍","中國籍（含港澳）","印尼籍","泰國籍"], answer:1,
explain:"依內政部歷年統計，臺灣新住民配偶來源中，以中國籍（含港澳）占比最高，其次才是越南籍；因此占比高達六成以上的「甲」最可能是中國籍。"},

{sec:0, tag:"人口地理・政策判斷", q:"臺灣近年出生人數屢創新低，各縣市政府紛紛加碼生育津貼、延長育嬰留職停薪，並增設公共托育中心。這些政策最主要是為了緩解臺灣哪一項人口問題？",
options:["少子化","人口外流","都市人口過度擁擠","性別比失衡"], answer:0,
explain:"生育津貼、育嬰留停、公共托育中心等措施，目的都是鼓勵民眾生育、降低育兒負擔，主要用來因應少子化造成的出生人數下降問題。"},

{sec:0, tag:"人口地理・名詞定義", q:"依國際慣例，一個國家或地區 65 歲以上人口占總人口比例達到某一門檻，即被歸類為「高齡社會」。請問這個門檻約為多少？",
options:["3%","7%","14%","20%"], answer:2,
explain:"依聯合國常用的分類標準：65 歲以上人口占比達 7% 為「高齡化社會」，達 14% 為「高齡社會」，達 20% 以上則為「超高齡社會」。"},

{sec:0, tag:"人口地理・密度計算", q:`下表為甲、乙、丙、丁四個國家的總人口與土地面積資料。若想找出「人口分布最擁擠」的國家，應選擇下列何者？
<div class="data-box"><table><thead><tr><th>國家</th><th>總人口（萬人）</th><th>土地面積（萬平方公里）</th></tr></thead><tbody>
<tr><td>甲</td><td>2,300</td><td>3.6</td></tr>
<tr><td>乙</td><td>12,000</td><td>38</td></tr>
<tr><td>丙</td><td>300</td><td>750</td></tr>
<tr><td>丁</td><td>5,000</td><td>10</td></tr>
</tbody></table></div>`,
options:["甲","乙","丙","丁"], answer:0,
explain:"人口密度＝總人口 ÷ 土地面積。甲＝2300÷3.6≈639 人/km²，乙＝12000÷38≈316 人/km²，丙＝300÷750＝0.4 人/km²，丁＝5000÷10＝500 人/km²。人口密度最高、分布最擁擠的是甲國。"},

// ===================== 二、產業地理 =====================
{sec:1, tag:"產業地理・分類判斷", q:"小華的家族原本經營養殖漁業（第一級產業），近年小華接手後，除了原有的養殖工作，還在漁塭旁開設一間「現撈海鮮餐廳」，供遊客現點現吃、體驗漁村生活。請問小華新開設的餐廳，主要屬於下列哪一級產業？",
options:["第一級產業","第二級產業","第三級產業","以上皆非"], answer:2,
explain:"第一級產業指農、林、漁、牧等直接利用自然資源的生產活動；第二級產業為製造、加工、營建業；第三級產業則是提供服務的行業，如餐飲、零售、金融、觀光等。餐廳屬於服務業，為第三級產業。"},

{sec:1, tag:"產業地理・升級判斷", q:"某家原本專做成衣代工的工廠，過去只是替國外品牌大量生產低單價服飾。近年來，該工廠投入大筆資金研發機能布料，並創立自有品牌，將產品定位在高單價的機能服飾市場，附加價值大幅提升。此一轉變最適合稱為下列何者？",
options:["產業外移","產業升級","產業空洞化","逆都市化"], answer:1,
explain:"由「單純代工、低附加價值」轉型為「自創品牌、高附加價值」的過程，屬於產業升級，是臺灣許多傳統產業因應競爭所採取的策略。"},

{sec:1, tag:"產業地理・區位因素", q:"某水泥公司評估設廠地點時，最終選擇將工廠設置在中央山脈東側、鄰近大型石灰石礦場的山區，而非設在較靠近都會區、交通更便利的平原地帶。該公司的區位選擇最主要考量下列哪一項工業區位因素？",
options:["市場","勞力","原料","動力"], answer:2,
explain:"水泥製造需要大量、笨重且不易長途運輸的石灰石作為原料，將工廠設在礦場附近可大幅降低原料運輸成本，屬於典型的原料指向工業。"},

{sec:1, tag:"產業地理・區位因素", q:"阿祥計畫在市中心開一家強調「當天現做、當天配送」的手作麵包店，主打新鮮不隔夜。若要達成此經營目標並吸引最多顧客上門，阿祥的麵包店應優先選擇設在下列何處？",
options:["原料（麵粉）產地附近","人口密集、消費力強的市場區","勞力低廉的鄉村地區","電力供應充足的工業區"], answer:1,
explain:"強調「現做現賣、時效性高」的產品，最重要的是能快速接觸大量消費者，因此應設在市場廣大（人口密集）的區域，屬於市場指向工業。"},

{sec:1, tag:"產業地理・區位因素", q:"某電解鋁工廠的生產過程需要消耗極大量的電力，佔其總生產成本的比例遠高於原料與勞力。因此該公司選擇將工廠設置在水力發電廠附近，以取得穩定且低廉的電力供應。此區位選擇主要考量下列哪一項因素？",
options:["原料","市場","動力（能源）","勞力"], answer:2,
explain:"電解鋁、煉鋁、部分化工業屬於高耗能產業，其區位選擇最重視電力等能源的取得是否穩定、便宜，屬於動力指向工業。"},

{sec:1, tag:"產業地理・產業特性", q:"1960～1970 年代，臺灣的紡織、製鞋、玩具代工等產業蓬勃發展，工廠需要雇用大量基層作業員從事縫製、組裝等工作，當時甚至流行「客廳即工廠」的家庭代工模式。這類產業具有下列哪一項特性？",
options:["資本密集","技術密集","勞力密集","原料密集"], answer:2,
explain:"紡織、製鞋、代工組裝等產業高度仰賴大量人力進行反覆性作業，對勞動力的需求遠高於資本或技術投入，屬於勞力密集產業。"},

{sec:1, tag:"產業地理・產業特性", q:"臺灣的半導體晶圓代工產業，每座晶圓廠的建廠成本動輒新臺幣千億元以上，且需要大量博士、碩士等高階研發人才投入製程技術的研發與改良。這類產業最主要具有下列哪一項特性？",
options:["勞力密集，需要大量基層人力","資本與技術密集，研發投入高、附加價值高","原料密集，仰賴大量進口原物料","市場指向，須緊鄰消費市場設廠"], answer:1,
explain:"晶圓代工需要龐大資金建置精密設備，並仰賴高階技術人才進行研發，屬於典型的資本與技術密集產業，產品附加價值也相對較高。"},

{sec:1, tag:"產業地理・貿易資料判讀", q:`下表為甲、乙、丙、丁四個國家某年的進出口貿易資料。請問哪一個國家的「入超」金額最大（即進口總值減出口總值的差額最大）？
<div class="data-box"><table><thead><tr><th>國家</th><th>出口總值（百萬美元）</th><th>進口總值（百萬美元）</th></tr></thead><tbody>
<tr><td>甲</td><td>1,016</td><td>1,035</td></tr>
<tr><td>乙</td><td>1,072</td><td>1,112</td></tr>
<tr><td>丙</td><td>556</td><td>445</td></tr>
<tr><td>丁</td><td>496</td><td>701</td></tr>
</tbody></table></div>`,
options:["甲","乙","丙","丁"], answer:3,
explain:"入超金額＝進口總值－出口總值。甲＝1035－1016＝19，乙＝1112－1072＝40，丙＝445－556＝－111（出超），丁＝701－496＝205。入超最大的是丁國。"},

{sec:1, tag:"產業地理・全球化", q:"近年來，由於臺灣國內基本工資與土地成本持續上漲，許多傳統勞力密集產業（如成衣、製鞋）陸續將生產基地遷往越南、印尼等東南亞國家，僅在臺灣保留研發與行銷部門。此現象最適合用下列哪一個名詞來解釋？",
options:["都市化","產業外移","產業升級","逆都市化"], answer:1,
explain:"企業因應成本考量，將生產製造環節遷往海外，僅保留研發、管理等高階功能於母國，此現象稱為產業外移，也是全球化下常見的產業分工模式。"},

{sec:1, tag:"產業地理・群聚效應", q:"新竹科學園區自成立以來，聚集了大量半導體與電子相關廠商，形成明顯的產業群聚效應。除了政府政策支持外，園區周邊還有國立清華大學、國立陽明交通大學及多所研究機構。這類人才與技術資源，對高科技產業的發展具有下列哪一項意義？",
options:["提供充足且低廉的勞動力","提供大量的工業原料","提供便利的港口，利於原料進口","提供高階研發人才與技術支援，強化產業競爭力"], answer:3,
explain:"高科技產業重視研發能力與人才素質，鄰近大學及研究機構可提供穩定的高階人才與技術合作資源，是科學園區選址的重要考量之一。"},

// ===================== 三、聚落與交通運輸 =====================
{sec:2, tag:"聚落地理・資料判讀", q:`地理老師整理了「大型聚落」與「小型聚落」在人口數、商店家數、聚落數量與交通路線數等特性上的一般差異，如下表所示。根據此表判斷，下列敘述何者正確？
<div class="data-box"><table><thead><tr><th>聚落規模</th><th>人口數</th><th>商店家數</th><th>聚落數量</th><th>交通路線數</th></tr></thead><tbody>
<tr><td>大型聚落</td><td>多</td><td>多</td><td>少</td><td>多</td></tr>
<tr><td>小型聚落</td><td>少</td><td>少</td><td>多</td><td>少</td></tr>
</tbody></table></div>`,
options:["聚落規模越大，聚落數量通常越多","聚落規模越大，商店家數通常越多、機能越齊全","聚落規模越大，對外交通路線通常越少","聚落規模與人口數並無明顯關係"], answer:1,
explain:"聚落規模越大（如都市），人口越多、消費力越強，能支撐的商店與服務種類也越多樣；反之小型聚落數量雖多，但單一聚落機能較單純。因此「規模越大、商店家數與機能越多」的敘述正確。"},

{sec:2, tag:"聚落地理・都市化", q:"小美的阿嬤常說：「以前這裡到處都是農田和三合院，鄰居彼此都認識；現在放眼望去全是高樓大廈，樓上樓下住了誰都不清楚，但工作機會和生活機能反而比以前方便許多。」阿嬤描述的這種土地利用與人口聚集型態的轉變，最適合用下列哪一個名詞解釋？",
options:["都市化","全球化","逆都市化","在地化"], answer:0,
explain:"由農業土地利用轉變為高樓林立、人口與非農業活動大量集中的過程，正是都市化的典型描述。"},

{sec:2, tag:"聚落地理・都市更新", q:"臺北市某老舊社區屋齡普遍超過 40 年，巷弄狹小、公共設施老舊。市政府近年將此區域劃入更新計畫，拆除部分危樓改建為現代化大樓，並拓寬道路、增設綠地與停車場，使社區機能與景觀煥然一新。此一作法稱為下列何者？",
options:["都市化","都市更新","郊區化","產業升級"], answer:1,
explain:"針對既有老舊都市地區進行拆除重建、整修或改善公共設施，以提升生活品質與土地使用效率的過程，稱為都市更新。"},

{sec:2, tag:"交通運輸・生活圈", q:"小傑住在新北市，每天搭乘捷運通勤到臺北市上班，車程只要 30 分鐘；他的表哥住在較偏遠的山區小鎮，雖然直線距離與臺北市中心相近，但因道路狹窄、班次稀少，通勤到臺北市卻要將近 2 小時。兩人的通勤時間差異，主要說明「生活圈」或「通勤圈」的範圍大小，最主要受下列哪一項因素影響？",
options:["當地氣候條件","交通運輸的便利程度","人口的性別比例","農業生產方式"], answer:1,
explain:"雖然兩地距離市中心的直線距離相近，但交通便利程度（捷運 vs. 山區道路）差異極大，使兩人實際通勤時間相差懸殊，說明交通運輸的便利程度是決定生活圈、通勤圈範圍大小的關鍵因素。"},

{sec:2, tag:"交通運輸・公路特性", q:"某有機農場主要種植葉菜類蔬菜，強調「清晨採收、上午即送達鄰近城市的傳統市場與超市」，講求新鮮與時效，且配送距離多在 50 公里以內。這類短程、少量、需要直接送達店家門口的貨物運送，最適合採用下列哪一種運輸方式？",
options:["公路運輸","鐵路運輸","海運","空運"], answer:0,
explain:"公路運輸機動性高，可深入產地與市場的巷弄門口，且適合短程、少量、需即時配送的貨物，因此公路運輸最適合這類生鮮蔬菜的短程配送。"},

{sec:2, tag:"交通運輸・鐵路特性", q:"某礦業公司每天需將數千噸煤礦從內陸礦場運送到數百公里外的港口，路線固定、貨物量大，且對運送時間的彈性要求不高。相較於公路運輸，下列哪一種運輸方式更適合承擔這項任務？",
options:["空運，因為速度最快","鐵路運輸，因為適合長程、大量、固定路線的運輸","機車快遞，因為機動性最高","以上皆不適合，只能用公路運輸"], answer:1,
explain:"鐵路運輸單次載運量大、行駛固定路線，特別適合長程、大宗、路線固定的貨物運輸，例如煤礦、砂石等，運輸成本也比公路更低。"},

{sec:2, tag:"交通運輸・海運特性", q:"臺灣的煉油廠與鋼鐵廠每年需進口大量原油與鐵礦砂，這些原物料多來自中東、澳洲等地。運送這類體積龐大、重量極重、對時效要求相對較低的大宗物資，最主要依賴下列哪一種運輸方式？",
options:["公路運輸","空運","海運","鐵路運輸"], answer:2,
explain:"海運雖然速度較慢，但運量極大、運費相對低廉，最適合用來運送原油、礦砂、穀物等大宗、低單價原物料，是國際貿易中最主要的貨運方式。"},

{sec:2, tag:"交通運輸・空運特性", q:"某電子公司急需將一批高單價的晶片樣品從臺灣送到美國客戶手中，要求 48 小時內送達，且貨物體積小、重量輕，但單價極高。這批貨物最適合採用下列哪一種運輸方式寄送？",
options:["海運，因為運費最低","空運，因為速度快、適合高單價輕巧貨物","鐵路運輸，因為最安全","公路運輸，因為最方便"], answer:1,
explain:"空運雖然運費較高，但速度快、時效性佳，特別適合運送單價高、重量輕、體積小且講求時效的貨物，例如晶片、精密零件、生鮮海鮮等。"},

{sec:2, tag:"交通運輸・高鐵影響", q:"臺灣高速鐵路通車後，臺北到高雄的行車時間縮短至 1.5 小時以內，許多人開始出現「早上在臺北開會、中午到臺中拜訪客戶、晚上回高雄的家」的生活型態。這個現象最主要說明高鐵通車對臺灣西部地區帶來下列哪一項影響？",
options:["使西部地區逐漸串連成一日生活圈","大幅降低了整體貨物運輸成本","完全取代了公路運輸的功能","促使大量人口移往東部地區"], answer:0,
explain:"高鐵大幅縮短城市間的移動時間，使原本需要跨日往返的行程能在一天內完成，讓臺灣西部各城市逐漸串連成緊密的一日生活圈。"},

{sec:2, tag:"聚落地理・郊區化", q:"某都市近二十年因市中心地價高漲、交通壅塞、居住空間狹小，許多居民與部分產業陸續遷往市郊，在郊區興建大型社區與購物中心，使市中心人口成長趨緩，郊區人口與商業活動則快速增加。此現象最適合稱為下列何者？",
options:["都市化","郊區化","產業升級","全球化"], answer:1,
explain:"人口與產業從都市核心向外圍郊區擴散、遷移的現象，稱為郊區化，常發生於都市化程度已相當成熟的大都市周邊。"}
];

let SCORE = {answered:0, correct:0};
let sectionScore = SECTIONS.map(()=>({answered:0, correct:0}));
let idx = 0;

function bumpScore(isCorrect, sec){
  SCORE.answered++;
  if(isCorrect) SCORE.correct++;
  sectionScore[sec].answered++;
  if(isCorrect) sectionScore[sec].correct++;
  document.getElementById('statAnswered').textContent = SCORE.answered;
  document.getElementById('statCorrect').textContent = SCORE.correct;
  document.getElementById('statRate').textContent = SCORE.answered ? Math.round(SCORE.correct/SCORE.answered*100)+'%' : '—';
}

function draw(){
  const area = document.getElementById('quizArea');
  if(idx >= QUESTIONS.length){
    area.style.display = 'none';
    const resultBox = document.getElementById('finalResult');
    resultBox.style.display = 'block';
    const pct = Math.round(SCORE.correct/SCORE.answered*100);
    let msg = '再接再厲，回頭複習答錯的觀念！';
    if(pct >= 90) msg = '滿分等級！三個章節都掌握得很扎實！';
    else if(pct >= 70) msg = '相當不錯，再抓緊幾個易混淆的觀念就更穩了。';

    const bdHtml = SECTIONS.map((name,i)=>{
      const s = sectionScore[i];
      const p = s.answered ? Math.round(s.correct/s.answered*100) : 0;
      return `<div class="bd-row">
        <div class="bd-label"><span>${name}</span><span>${s.correct} / ${s.answered}</span></div>
        <div class="bd-bar"><div class="bd-fill" style="width:${p}%;"></div></div>
      </div>`;
    }).join('');

    resultBox.innerHTML = `
      <div class="stamp ok" style="font-size:18px;">測驗完成</div>
      <div class="big">${SCORE.correct} / ${SCORE.answered}</div>
      <div class="msg">正確率 ${pct}%　${msg}</div>
      <div class="section-bd">${bdHtml}</div>
      <button class="next-btn" id="retryBtn" style="margin-top:22px;">再挑戰一次</button>
    `;
    document.getElementById('retryBtn').addEventListener('click', ()=>{
      idx = 0; SCORE = {answered:0, correct:0};
      sectionScore = SECTIONS.map(()=>({answered:0, correct:0}));
      document.getElementById('statAnswered').textContent = 0;
      document.getElementById('statCorrect').textContent = 0;
      document.getElementById('statRate').textContent = '—';
      resultBox.style.display = 'none';
      area.style.display = 'block';
      draw();
    });
    return;
  }
  const it = QUESTIONS[idx];
  const pct = Math.round((idx)/QUESTIONS.length*100);
  area.innerHTML = `
    <div class="qhead">
      <span class="qcount">第 ${idx+1} / ${QUESTIONS.length} 題</span>
      <span class="qtag">${it.tag}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="prompt">${it.q}</div>
    <div class="options"></div>
    <div class="explain" id="ex"></div>
    <div class="qcontrols"><button class="next-btn" id="nextBtn" disabled>${idx+1 === QUESTIONS.length ? '查看結果' : '下一題'}</button></div>
  `;
  const optsWrap = area.querySelector('.options');
  it.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = String.fromCharCode(65+i) + '　' + opt;
    b.dataset.i = i;
    optsWrap.appendChild(b);
  });
  const btns = optsWrap.querySelectorAll('.opt-btn');
  btns.forEach(b=>{
    b.addEventListener('click', ()=>{
      btns.forEach(x=>x.disabled=true);
      const chosen = parseInt(b.dataset.i);
      const ok = chosen === it.answer;
      if(ok){ b.classList.add('correct'); }
      else{
        b.classList.add('wrong');
        btns.forEach(x=>{ if(parseInt(x.dataset.i)===it.answer) x.classList.add('reveal'); });
      }
      const ex = document.getElementById('ex');
      ex.classList.add('show');
      ex.innerHTML = `<div class="lab">解析</div>${it.explain}`;
      document.getElementById('nextBtn').disabled = false;
      bumpScore(ok, it.sec);
    });
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ idx++; draw(); });
}

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('startBtn').addEventListener('click', ()=>{
    document.getElementById('intro').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    draw();
  });
});
</script>
</body>
</html>
