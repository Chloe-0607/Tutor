<script>
const units = [
  { id: 1, eyebrow: "CHAPTER 01", title: "易混淆成語", desc: "辨清字面相近、方向相反的成語，讓用字更準確。", tone: "seal", questions: [
    { q: "他上大學後靠打工養活自己，不再向父母拿錢，這是「＿＿＿」。", opts: ["自食其力", "自食其果", "坐吃山空", "抱薪救火"], ans: 0, ex: "自食其力指憑自己的力量養活自己；自食其果是自己承擔壞事的後果。" },
    { q: "敵軍看到我方氣勢驚人，還沒開戰就潰散逃跑，屬於「＿＿＿」。", opts: ["所向披靡", "望風披靡", "四面楚歌", "兔死狗烹"], ans: 1, ex: "望風披靡是被對方氣勢震懾、未戰先敗；所向披靡則是我方力量所到之處敵人潰退。" },
    { q: "他年紀輕輕卻辦事老練圓熟，應用哪個成語？", opts: ["少不更事", "少年老成", "妄自尊大", "小時了了"], ans: 1, ex: "少年老成比喻年紀雖輕、舉止卻成熟穩重。" },
    { q: "形容「趕不上」用哪個成語？", opts: ["望塵莫及", "望其項背", "門可羅雀", "雪中送炭"], ans: 0, ex: "望塵莫及是趕不上；望其項背則是趕得上，兩者意思相反。" },
    { q: "他明明能力不足，卻硬要別人做超出能力範圍的事，這叫「＿＿＿」。", opts: ["差強人意", "強人所難", "好整以暇", "席不暇暖"], ans: 1, ex: "強人所難指勉強別人做能力不及之事；差強人意則是大體上還算令人滿意。" },
    { q: "在別人艱困時及時伸出援手，是「＿＿＿」。", opts: ["雪中送炭", "抱薪救火", "坐收漁利", "坐吃山空"], ans: 0, ex: "雪中送炭是適時給予援助；抱薪救火則是用錯方法反而使禍害加深。" },
    { q: "這次比賽得獎的人非常多，多到「＿＿＿」，空格該填？", opts: ["屈指可數", "指不勝屈", "望塵莫及", "望其項背"], ans: 1, ex: "指不勝屈形容數量很多；屈指可數則是數量很少。" },
    { q: "形容一個人奔走忙碌、毫無休息，用「＿＿＿」。", opts: ["好整以暇", "席不暇暖", "坐吃山空", "守口如瓶"], ans: 1, ex: "席不暇暖形容奔走忙碌、沒有休息；好整以暇則是在紛亂中仍從容不迫。" },
    { q: "這道理淺顯到不需要說明，大家都懂，用「＿＿＿」。", opts: ["不可言喻", "不言可喻", "不以為然", "不以為意"], ans: 1, ex: "不言可喻指不需言語解釋就能明白；不可言喻則是無法用言語形容。" },
    { q: "形容豪擲金錢、毫不吝惜，用「＿＿＿」。", opts: ["一擲千金", "一字千金", "一箭雙鵰", "一箭之地"], ans: 0, ex: "一擲千金形容不惜金錢的豪舉；一字千金是比喻文辭精當、價值極高。" },
    { q: "比喻只顧眼前、不顧後患的成語是？", opts: ["飲鴆止渴", "畫餅充飢", "揠苗助長", "揚湯止沸"], ans: 0, ex: "飲鴆止渴比喻只顧眼前，不管後患。" },
    { q: "做事拖到最後才想辦法，最適合用哪個成語？", opts: ["未雨綢繆", "臨渴掘井", "防微杜漸", "居安思危"], ans: 1, ex: "臨渴掘井比喻事到臨頭才想辦法；其餘都是事先準備或防範。" },
    { q: "形容彼此同樣低劣、並無差異的是？", opts: ["一丘之貉", "莫逆之交", "管鮑之交", "忘年之交"], ans: 0, ex: "一丘之貉比喻彼此同樣低劣、並無差異，帶有貶義。" },

const letters=["A","B","C","D"];
let unitId=0, questionIndex=0, answers={}, submitted=false, showReview=false;
const app=document.getElementById('app');

function startUnit(id){unitId=id;questionIndex=0;answers={};submitted=false;showReview=false;window.scrollTo({top:0,behavior:'smooth'});render()}
function choose(option){if(submitted||answers[questionIndex]!==undefined)return;answers[questionIndex]=option;render()}
function next(){const unit=units[unitId-1];if(questionIndex<unit.questions.length-1){questionIndex++;render()}else{submitted=true;showReview=false;render()}window.scrollTo({top:0,behavior:'smooth'})}
function reset(){startUnit(unitId)}
function scoreOf(unit){return unit.questions.reduce((sum,item,index)=>sum+(answers[index]===item.ans?1:0),0)}
function chapterNav(){return units.map(u=>`<button class="chapter-link ${unitId===u.id?'active':''} ${unitId>u.id?'done':''}" onclick="startUnit(${u.id})"><span class="chapter-no">${String(u.id).padStart(2,'0')}</span><span>${u.title}</span>${unitId>u.id?'<span class="check">✓</span>':''}</button>`).join('')}
function shell(content){return `<div class="site-shell"><div class="paper-noise"></div><aside class="book-spine"><div class="brand-mark" aria-label="成語闖關摺頁印"><span class="fold-mark"></span></div><div class="brand-copy"><span>成語闖關</span><small>60 QUESTION BOOK</small></div><div class="spine-rule"></div><div class="spine-label">章節索引</div><nav class="chapter-nav" aria-label="測驗章節">${chapterNav()}</nav><div class="spine-bottom"><span class="vertical-note">讀一頁，答一題，留下自己的批註。</span><div class="total-progress"><span>總進度</span><b>${unitId?Math.min(unitId*20,60):0} / 60</b></div></div></aside><main class="main-page"><header class="masthead"><div class="masthead-kicker"><span class="red-dot"></span> 國語文互動題簿 <span class="line"></span></div><div class="masthead-meta">第 01 冊 ／ 2026</div></header>${content}<footer class="page-footer"><span>活用成語 · 互動複習站</span><span>一頁一頁，讀成自己的話。</span></footer></main></div>`}
function landing(){return shell(`<section class="landing-page"><div class="hero-copy"><div class="seal-stamp">成<br>語</div><p class="overline">把成語用起來 · 互動題簿</p><h1>把成語讀懂，<br><em>讓語言落筆。</em></h1><p class="hero-desc">三個章節、六十道題。從容易混淆的字義，到典故與語境，循著書脊一步步完成你的成語批註。</p><button class="primary-cta" onclick="startUnit(1)">翻開第一章 ${icon.arrow}</button></div><div class="hero-art" aria-label="CSS 繪製的成語題簿插圖"><div class="css-book"><div class="book-pages"></div><div class="book-spine-line"></div></div><div class="css-seal-dot"></div><div class="css-bookmark"></div><div class="art-note">「熟讀而精思，<br>可也。」</div><div class="art-caption">頁邊批註 01 ／ 一冊題簿 · 三章六十題</div></div><div class="landing-stats"><div><b>03</b><span>章節</span></div><div><b>60</b><span>道題目</span></div><div><b>01</b><span>次次落筆</span></div><span class="margin-annotation">批註：先讀題，再落筆。</span></div></section>`)}
function quiz(){const unit=units[unitId-1],q=unit.questions[questionIndex],selected=answers[questionIndex],has=selected!==undefined,correct=has&&selected===q.ans;const opts=q.opts.map((o,i)=>{const state=has?(i===q.ans?'correct':i===selected?'wrong':'muted'):'';return `<button class="option ${state} ${selected===i?'picked':''}" onclick="choose(${i})" ${has?'disabled':''}><span class="option-letter">${letters[i]}</span><span>${o}</span>${has&&i===q.ans?`<span class="option-check">${icon.check}</span>`:''}${has&&i===selected&&i!==q.ans?`<span class="option-check">${icon.cross}</span>`:''}</button>`}).join('');const feedback=has?`<div class="answer-feedback ${correct?'correct':'incorrect'}"><div class="feedback-title">${correct?icon.check+' 答對了，這個成語用得很準。':icon.cross+' 再想一下，這題的正解是「'+q.opts[q.ans]+'」。'}</div><p>${q.ex}</p></div>`:'';return shell(`<section class="quiz-page"><div class="quiz-intro"><div><p class="overline">${unit.eyebrow}</p><h1>${unit.title}</h1><p>${unit.desc}</p></div><div class="chapter-emblem">0${unit.id}<span>章</span></div></div><div class="progress-wrap"><div class="progress-meta"><span>題目 ${String(questionIndex+1).padStart(2,'0')} / 20</span><span>${Object.keys(answers).length} 題已作答</span></div><div class="progress-track"><div style="width:${((questionIndex+1)/20)*100}%"></div></div></div><article class="question-sheet"><div class="bookmark"></div><div class="question-top"><span>QUESTION ${String(questionIndex+1).padStart(2,'0')}</span><span>${icon.book}</span></div><h2>${q.q}</h2><div class="options" role="radiogroup">${opts}</div>${feedback}<div class="sheet-footer"><span>${has?(correct?'答對了，解析在下方':'已標示正解，讀完解析再翻頁'):(questionIndex<19?'選好答案後，立即查看解析':'完成這一章後查看批註')}</span><button class="next-cta" ${has?'':'disabled'} onclick="next()">${questionIndex<19?'下一題 '+icon.arrow:'完成本章 '+icon.trophy}</button></div></article><div class="quiz-hint"><span class="star">${icon.star}</span> 提醒：答案送出後會顯示解析，先相信你的第一直覺。</div></section>`)}
function result(){const unit=units[unitId-1],score=scoreOf(unit),pct=Math.round(score/20*100),reviews=showReview?`<div class="review-list">${unit.questions.map((q,i)=>`<div class="review-row ${answers[i]===q.ans?'correct':'wrong'}"><div class="review-index">${String(i+1).padStart(2,'0')}</div><div><b>${q.q}</b><p>你的答案：${answers[i]!==undefined?q.opts[answers[i]]:'未作答'} · 正解：${q.opts[q.ans]}</p><small>${q.ex}</small></div><i>${answers[i]===q.ans?icon.check:icon.cross}</i></div>`).join('')}</div>`:'';return shell(`<section class="result-page"><div class="result-heading"><p class="overline">CHAPTER ${String(unit.id).padStart(2,'0')} · 已完成</p><h1>這一章，<em>批註完畢。</em></h1><p>你的答案已收進題簿。回看錯題，下一章會更穩。</p></div><div class="score-card tone-${unit.tone}"><div class="score-seal"><span>${pct}</span><small>分</small></div><div class="score-copy"><span>${unit.title}</span><strong>${score} <i>/ 20</i></strong><p>${pct>=85?'章法清楚，這一頁讀得很漂亮。':pct>=60?'已經掌握大半，再把幾個字義磨亮。':'別急著翻頁，回看解析，下一次會更準。'}</p></div></div><div class="result-actions"><button class="primary-cta" onclick="showReview=!showReview;render()">${showReview?'收起批註':'查看批註'} ${icon.arrow}</button><button class="secondary-cta" onclick="reset()">↻ 再答一次</button>${unit.id<3?`<button class="text-cta" onclick="startUnit(${unit.id+1})">前往下一章 ${icon.arrow}</button>`:''}</div>${reviews}</section>`)}
function render(){app.innerHTML=unitId?(submitted?result():quiz()):landing()}
render();
</script>
</body>
</html>
