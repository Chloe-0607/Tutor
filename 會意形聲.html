<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字偵探社｜造字法則與字體演變</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eee5d0;
  --paper-deep:#e2d5b4;
  --card:#f8f2e2;
  --ink:#2a221a;
  --ink-soft:#5c4f3f;
  --seal:#a13a2a;
  --seal-deep:#7d2a1d;
  --gold:#a9812f;
  --gold-soft:#c9ab5f;
  --line:#c9b98d;
  --good:#3f6b4a;
  --shadow: 0 10px 30px -12px rgba(42,34,26,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(169,129,47,.10), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(161,58,42,.08), transparent 45%);
  color:var(--ink);
  font-family:'Noto Sans TC', sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Noto Serif TC', serif; margin:0; color:var(--ink);}
.wrap{max-width:980px; margin:0 auto; padding:0 20px;}
a{color:inherit;}

/* ===== Header / Case File Masthead ===== */
.masthead{
  position:relative;
  padding:20px 16px 14px;
  border-bottom:6px double var(--gold);
  background:var(--paper);
  overflow:hidden;
}
.masthead::before{display:none;}
.badge-row{display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:3px;}
.eyebrow{
  font-family:'JetBrains Mono', monospace; font-weight:700;
  letter-spacing:.12em; font-size:13px; color:var(--seal-deep);
  border:1px solid var(--seal-deep); border-radius:3px;
  padding:4px 10px; background:rgba(161,58,42,.06);
}
.masthead h1{
  text-align:center; font-size:clamp(30px,6vw,48px); font-weight:900;
  letter-spacing:.06em; margin-bottom:3px; position:relative; z-index:1;
}
.masthead .sub{
  text-align:center; color:var(--ink-soft); font-size:15.5px; position:relative; z-index:1;
}
.masthead .case-meta{
  text-align:center; margin-top:6px; font-size:12.5px; color:var(--ink-soft);
  font-family:'JetBrains Mono', monospace; letter-spacing:.03em;
}
.glyph-strip{
  display:flex; justify-content:center; gap:clamp(8px,2vw,24px); margin-top:6px; position:relative; z-index:1;
}
.glyph-strip span{
  font-family:'Noto Serif TC', serif; font-weight:700; font-size:clamp(30px,5vw,46px);
  color:var(--ink); opacity:.75;
}

/* ===== Nav ===== */
.tabbar{
  position:sticky; top:0; z-index:50;
  background:rgba(238,229,208,.94); backdrop-filter:blur(6px);
  border-bottom:2px solid var(--line);
}
.tabbar-inner{
  display:flex; gap:6px; overflow-x:auto; padding:8px 10px; max-width:980px; margin:0 auto;
  scrollbar-width:thin;
}
.tab-btn{
  flex:0 0 auto; white-space:nowrap;
  font-family:'Noto Serif TC', serif; font-weight:700; font-size:13.5px;
  padding:9px 16px; border-radius:20px; border:1.5px solid transparent;
  background:transparent; color:var(--ink-soft); cursor:pointer;
  transition:.18s;
}
.tab-btn:hover{background:rgba(169,129,47,.12);}
.tab-btn.active{
  background:var(--ink); color:var(--paper); border-color:var(--ink);
}

/* ===== Sections ===== */
section.panel{display:none; padding:14px 0 28px; animation:fade .35s ease;}
section.panel.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.station-tag{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12.5px;
  letter-spacing:.1em; color:#fff; background:var(--seal);
  padding:5px 12px; border-radius:3px 3px 3px 12px; margin-bottom:10px;
}
h2.title{font-size:clamp(20px,3.5vw,26px); font-weight:900; margin-bottom:14px;}
.lede{color:var(--ink-soft); margin-bottom:18px; font-size:13.5px; max-width:680px;}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px;
}
.card h3{font-size:15px; font-weight:700; margin-bottom:12px; color:var(--seal-deep);}
.card h3 .num{
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%; background:var(--seal-deep); color:#fff;
  font-family:'JetBrains Mono', monospace; font-size:13px; margin-right:8px; vertical-align:-4px;
}

/* callouts */
.callout{
  border-left:4px solid var(--gold); background:rgba(169,129,47,.09);
  border-radius:0 8px 8px 0; padding:12px 14px; margin:16px 0; font-size:14px; line-height:1.7;
}
.callout.trap{border-left-color:var(--seal); background:rgba(161,58,42,.08);}
.callout.tip{border-left-color:var(--good); background:rgba(63,107,74,.08);}
.callout strong{color:var(--ink);}

/* tables */
table{width:100%; border-collapse:collapse; margin:16px 0; font-size:13px; line-height:1.6;}
th,td{border:1px solid var(--line); padding:10px 12px; text-align:left; vertical-align:middle;}
th{background:var(--paper-deep); font-family:'Noto Serif TC',serif; font-weight:700; color:var(--seal-deep); padding:5px 10px;}
td.glyph{font-family:'Noto Serif TC', serif; font-size:22px; text-align:center; font-weight:700; min-width:100px; white-space:nowrap; padding:6px 10px;}
tr:nth-child(even) td{background:rgba(255,255,255,.35);}

/* Decision tree tool (signature element) */
.tree-wrap{
  background:linear-gradient(135deg, var(--card), var(--paper-deep));
  color:var(--ink); border-radius:14px; padding:22px 22px; border:1.5px solid var(--gold-soft);
  box-shadow:var(--shadow); position:relative; overflow:hidden; margin-top:18px;
}
.tree-wrap::after{
  content:"⁘"; position:absolute; right:18px; top:14px; color:var(--gold); font-size:22px; opacity:.4;
}
.tree-wrap h3{color:var(--seal-deep); font-size:17px; margin-bottom:8px;}
.tree-sub{color:var(--ink-soft); font-size:13px; margin-bottom:18px; line-height:1.6;}
.tree-input-row{display:flex; gap:10px; margin-bottom:16px;}
.tree-input-row input{
  flex:1; min-width:0; font-family:'Noto Serif TC', serif; font-size:15px; font-weight:700;
  padding:10px 12px; border-radius:8px; border:1.5px solid var(--gold-soft);
  background:rgba(255,255,255,.6); color:var(--ink);
}
.tree-input-row input::placeholder{color:var(--ink-soft); font-weight:400; font-size:14px;}
.tree-input-row input:focus{outline:2px solid var(--gold); background:#fff;}
.tree-input-row button{
  font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:14px;
  padding:10px 18px; border-radius:8px; border:none; background:var(--seal); color:#fff;
  cursor:pointer; flex-shrink:0; transition:.15s;
}
.tree-input-row button:hover{background:var(--seal-deep);}
.tree-char-tag{
  display:none; font-family:'Noto Serif TC', serif; font-weight:900; font-size:15px;
  color:var(--seal-deep); margin-bottom:10px;
}
.tree-char-tag.show{display:block;}
.tree-q{
  font-size:15px; font-weight:700; margin-bottom:16px; min-height:44px; line-height:1.6; color:var(--ink);
}
.tree-choices{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
.tree-choices button{
  flex:1 1 160px; font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:13.5px;
  padding:14px 16px; border-radius:8px; border:1.5px solid var(--gold-soft);
  background:rgba(255,255,255,.55); color:var(--ink); cursor:pointer; transition:.15s;
}
.tree-choices button:hover{background:var(--gold-soft); color:var(--ink);}
.tree-progress{display:flex; gap:8px; margin-bottom:14px;}
.tree-progress span{height:4px; flex:1; background:rgba(42,34,26,.12); border-radius:2px;}
.tree-progress span.done{background:var(--gold);}
.tree-result{
  display:none; text-align:center; padding:28px 14px;
}
.tree-result.show{display:block;}
.tree-result .stamp-big{
  display:inline-flex; align-items:center; justify-content:center;
  width:120px; height:120px; border-radius:50%; border:5px solid var(--seal);
  color:var(--seal); font-family:'Noto Serif TC', serif; font-weight:900; font-size:38px;
  transform:rotate(-8deg); margin-bottom:16px; background:rgba(161,58,42,.08);
}
.tree-result p{color:var(--ink-soft); font-size:13.5px; max-width:520px; margin:0 auto 14px; line-height:1.7;}
.tree-restart{
  font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:.06em;
  color:var(--seal-deep); background:transparent; border:1px solid var(--gold-soft);
  border-radius:20px; padding:8px 16px; cursor:pointer;
}
.tree-restart:hover{background:rgba(169,129,47,.14);}
.tree-path{font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft); opacity:.8; margin-top:12px;}

/* Timeline (script evolution) */
.timeline{display:flex; overflow-x:auto; gap:14px; padding:4px 2px 16px; scroll-snap-type:x proximate;}
.tl-card{
  scroll-snap-align:start; flex:0 0 170px; background:var(--ink); color:var(--paper);
  border-radius:12px; padding:12px 12px; position:relative; cursor:pointer;
  border:2px solid transparent; transition:.2s;
}
.tl-card:hover, .tl-card.active{border-color:var(--seal); transform:translateY(-4px);}
.tl-card .era{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold-soft); letter-spacing:.05em;}
.tl-card .glyph-big{font-family:'Noto Serif TC', serif; font-size:44px; font-weight:900; margin:8px 0 4px;}
.tl-card .name{font-weight:700; font-size:15px;}
.tl-detail{
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  box-shadow:var(--shadow); min-height:60px; display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;
}
.tl-detail .info{flex:1; min-width:200px;}
.tl-detail img{
  width:80px; height:110px; object-fit:cover; border-radius:4px; box-shadow:0 4px 14px -4px rgba(0,0,0,.4);
  border:1px solid var(--line); flex-shrink:0;
}

.tl-detail .name{font-size:17px; font-weight:900; color:var(--seal-deep); margin-bottom:3px;}
.tl-detail .desc{font-size:13.5px; color:var(--ink-soft);}
.tl-detail .keyword{
  display:inline-block; margin-top:6px; font-family:'JetBrains Mono', monospace;
  font-size:12px; background:var(--paper-deep); padding:4px 10px; border-radius:4px; color:var(--seal-deep);
}

/* Quiz */
.quiz-item{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; margin-bottom:20px;
}
.quiz-item .qtext{font-weight:700; margin-bottom:12px; font-size:13.5px; line-height:1.7;}
.quiz-item .qtext .qnum{color:var(--seal); font-family:'JetBrains Mono', monospace; margin-right:6px;}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:560px){.opt-grid{grid-template-columns:1fr;}}
.opt{
  text-align:left; font-size:13px; padding:9px 12px; border-radius:6px;
  border:1px solid var(--line); background:rgba(255,255,255,.4); cursor:pointer; transition:.15s;
}
.opt:hover{border-color:var(--gold);}
.opt.correct{background:rgba(63,107,74,.18); border-color:var(--good); font-weight:700;}
.opt.wrong{background:rgba(161,58,42,.14); border-color:var(--seal);}
.opt[disabled]{cursor:default;}
.quiz-fb{margin-top:6px; font-size:13px; font-weight:700; display:none;}
.quiz-fb.show{display:block;}
.quiz-fb.ok{color:var(--good);}
.quiz-fb.bad{color:var(--seal-deep);}
.quiz-explain{display:block; margin-top:8px; padding:10px 12px; border-left:3px solid var(--gold); background:rgba(169,129,47,.10); color:var(--ink-soft); font-weight:400; line-height:1.7;}
.quiz-explain strong{color:var(--seal-deep);}

.score-bar{
  display:flex; justify-content:center; margin-top:4px;
}
.score-pill{
  background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace;
  font-weight:700; font-size:13px; padding:6px 14px; border-radius:30px; box-shadow:var(--shadow);
}

.mnemonic-box{
  background:linear-gradient(135deg, rgba(169,129,47,.12), rgba(161,58,42,.06));
  border:1.5px dashed var(--gold); border-radius:10px; padding:16px 18px; margin:18px 0;
  text-align:center;
}
.mnemonic-box .line{font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px; margin:8px 0; line-height:1.7;}
.mnemonic-box .line b{color:var(--seal-deep);}

footer{
  text-align:center; padding:8px 12px 12px; font-size:12.5px; color:var(--ink-soft);
  border-top:2px solid var(--line);
}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:640px){.two-col{grid-template-columns:1fr;}}

.timer-chip{
  display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace;
  background:var(--seal); color:#fff; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:700;
}
</style>
</head>
<body>

<header class="masthead">
  <div class="badge-row">
    <span class="eyebrow">CASE FILE</span>
  </div>
  <h1>漢字偵探社</h1>
  <p class="sub">造字法則大破解：象形 · 指事 · 會意 · 形聲 ＋ 字體演變</p>
  <div class="case-meta">適用單元：欣賞造字法則（命題排行榜 No.12） ／ 涵蓋：第1站 造字法則・第2站 漢字形體的演變</div>
  <div class="glyph-strip">
    <span>日</span><span>月</span><span>火</span><span>炎</span><span>森</span>
  </div>

<nav class="tabbar">
  <div class="tabbar-inner" id="tabbar"></div>
</nav>

<main class="wrap" id="main"></main>

/* ============ RENDER HELPERS ============ */
function el(html){const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild;}

function renderQuizList(list, containerId, scoreId, prefix){
  const container = document.getElementById(containerId);
  list.forEach((item, idx)=>{
    const card = el(`<div class="quiz-item" data-idx="${idx}">
      <div class="qtext"><span class="qnum">${prefix}${idx+1}</span>${item.q}</div>
      <div class="opt-grid"></div>
      <div class="quiz-fb"></div>
    </div>`);
    const grid = card.querySelector('.opt-grid');
    const letters = ['A','B','C','D'];
    item.opts.forEach((optText, oi)=>{
      const btn = el(`<button class="opt">(${letters[oi]}) ${optText}</button>`);
      btn.addEventListener('click', ()=>{
        if(card.dataset.answered) return;
        card.dataset.answered = "1";
        const allBtns = grid.querySelectorAll('.opt');
        allBtns.forEach(b=>b.disabled=true);
        const fb = card.querySelector('.quiz-fb');
        const answerText = item.opts[item.a];
        const status = oi === item.a ? '✓ 破案！答對了。' : '✗ 再想想——正確答案已標示為綠色。';
        if(oi === item.a){
          btn.classList.add('correct');
          fb.classList.add('show','ok');
          bumpScore(scoreId, true);
        } else {
          btn.classList.add('wrong');
          allBtns[item.a].classList.add('correct');
          fb.classList.add('show','bad');
          bumpScore(scoreId, false);
        }
        fb.innerHTML = `${status}<span class="quiz-explain"><strong>正確答案：(${letters[item.a]}) ${answerText}</strong><br>${item.explain || '請從題幹中的關鍵字，對照各選項的造字法則與書體特徵判斷。'}</span>`;
      });
      grid.appendChild(btn);
    });
    container.appendChild(card);
  });
}

const scoreState = {};
function bumpScore(scoreId, correct){
  if(!scoreState[scoreId]) scoreState[scoreId] = {right:0, total:0};
  scoreState[scoreId].total++;
  if(correct) scoreState[scoreId].right++;
  const pill = document.getElementById(scoreId);
  if(pill) pill.textContent = `答題進度：${scoreState[scoreId].total} / ${pill.dataset.max} ・ 答對 ${scoreState[scoreId].right}`;
}

  treeChar = val;
  if(val){
    treeCharTag.textContent = `🔎 目前偵查中的字：「${val}」`;
    treeCharTag.classList.add('show');
  } else {
    treeCharTag.classList.remove('show');
  }
  restartTree();
}
document.getElementById('treeCharGo').addEventListener('click', beginInvestigation);
treeCharInput.addEventListener('keydown', e=>{ if(e.key==='Enter') beginInvestigation(); });
restartTree();

/* ============ FINAL BOSS TIMER ============ */
let bossSeconds = 0;
let bossTimerStarted = false;
function startBossTimer(){
  if(bossTimerStarted) return;
  bossTimerStarted = true;
  setInterval(()=>{
    bossSeconds++;
    const m = String(Math.floor(bossSeconds/60)).padStart(2,'0');
    const s = String(bossSeconds%60).padStart(2,'0');
    const chip = document.getElementById('timerChip');
    if(chip) chip.textContent = `⏱ ${m}:${s}`;
  }, 1000);
}
document.querySelector('[data-tab="boss"]').addEventListener('click', startBossTimer);
</script>
