<style>

  --paper:#f7f4ec; --card:#fffefa; --ink:#292a25; --muted:#655f54;

p {margin:0 0 12px}
button {font:inherit;cursor:pointer;touch-action:manipulation}

[hidden] {display:none!important}
.wrap {width:min(940px,calc(100% - 36px));margin-inline:auto}
.hero {position:relative;overflow:hidden;background:radial-gradient(ellipse at 8% 5%,#eee6d5,transparent 63%),linear-gradient(120deg,#f6f3e9,#e6efeb);text-align:center}
.hero::after {content:"湖";position:absolute;right:max(3vw,12px);top:-48px;font:900 clamp(180px,24vw,260px)/1.3 var(--serif);color:var(--lake);opacity:.075;pointer-events:none}
.hero-inner {position:relative;z-index:1;padding:49px 0 37px}
.eyebrow {font-size:12px;font-weight:800;letter-spacing:.26em;color:var(--seal);margin:0 0 9px}
h1 {font-size:clamp(36px,6vw,52px);letter-spacing:.12em;color:var(--deep);margin-bottom:9px}
.lead {max-width:540px;margin:0 auto;color:#545b50;font-size:15px;font-weight:600}
.study-nav {position:sticky;top:0;z-index:20;background:#f7f4ecf5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-items {display:flex;overflow-x:auto;scrollbar-width:thin;gap:3px}
.nav-items a {flex:1 0 auto;text-align:center;color:var(--muted);text-decoration:none;padding:13px 15px 10px;border-bottom:3px solid transparent;font-size:15px;font-weight:800;white-space:nowrap}
.nav-items a[aria-current] {color:var(--deep);border-bottom-color:var(--lake);background:#e9efea}
main {padding:26px 0 56px}
.page-heading {display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
h2 {font-size:30px;color:var(--deep);margin-bottom:6px}
.page-heading p {max-width:660px;font-size:15px;color:var(--muted);margin:0}
.summary {font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;align-self:start;padding-top:9px}
.summary b {font-size:16px;color:var(--seal)}
.poem-links {display:flex;flex-wrap:wrap;gap:8px;margin-bottom:23px}
.poem-links a {background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:14px;font-weight:700;text-decoration:none}
.poem-card {background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:30px;overflow:hidden;scroll-margin-top:75px}
.poem-header {display:flex;justify-content:space-between;align-items:start;gap:14px;padding:23px 27px 17px;background:linear-gradient(100deg,#edf2ec,#fffefa)}
.poem-header h3 {font-size:25px;color:var(--deep);margin:0 0 3px}
.subtitle {font:700 17px/1.6 var(--serif);margin:0 0 4px;color:var(--lake)}
.byline {color:var(--muted);font-size:14px;font-weight:600}
.form-tag {background:#fffaf0;border:1px solid #dfceb0;color:#7b5932;border-radius:5px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap;margin-top:3px}
.poem-body {padding:23px 27px}
.reading {display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:27px;align-items:start}
.verse {font:700 22px/2.25 var(--serif);margin:0 0 14px;color:#283c35}
.verse-line {display:block}
.verse .stanza {display:block;height:11px}
.word {display:inline;padding:0;background:transparent;border:0;border-bottom:1px dotted #7f9b87;border-radius:0;font:inherit;line-height:inherit;color:#376556}
.word[aria-pressed="true"] {background:#dcebdd;color:#214a38}
.word-note {background:var(--pale);border-radius:7px;padding:10px 13px;font-size:14px;margin:8px 0 14px}
.word-note strong {color:var(--deep)}
.word-hint {font-size:12px;color:var(--muted);font-weight:600;margin:0 0 10px}
.translation {background:#f2f1e7;border-radius:7px;margin-top:13px}
.translation summary {padding:10px 13px;color:var(--deep);font-weight:800;cursor:pointer;font-size:14px}
.translation p {padding:0 14px 13px;margin:0;font-size:15px;font-weight:500}
.reading-points {border-left:1px solid var(--line);padding-left:22px}
.point + .point {margin-top:15px}
.point h4 {font:800 15px/1.7 var(--sans);color:var(--seal);margin:0 0 4px}
.point p {margin:0;font-size:15px;line-height:1.9;color:#514e44}
.exercise {background:#f7f8f2;border-top:1px solid var(--line);padding:21px 27px 24px;scroll-margin-top:75px}
.exercise-head {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.exercise-head strong {font-size:14px;color:var(--lake);font-weight:800}
.exercise-head span {font-size:13px;color:var(--muted);font-weight:600}
.head-tools {display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn.small {font-size:13px;padding:2px 10px}
.question {font:700 19px/1.85 var(--sans);margin:5px 0 13px}
.options {display:grid;grid-template-columns:1fr 1fr;gap:9px}
.option {display:flex;gap:10px;align-items:start;background:var(--card);color:var(--ink);border:1px solid #cecfc0;border-radius:7px;text-align:left;padding:11px 13px;font-size:15px;line-height:1.75;font-weight:600}
.option:hover:not(:disabled) {background:#e9f0e7;border-color:#6e9681}
.letter {font-weight:800;flex:0 0 18px;color:var(--lake)}
.option.selected {background:#e5eee4;border-color:#5c876b;box-shadow:inset 3px 0 #5c876b}
.option.correct {background:#e4efdf;border-color:#689366}
.option.incorrect {background:#f6e6df;border-color:#bc8370}
.option small {font-size:12px;font-weight:700}
.evidence .option {font-family:var(--serif);font-weight:700;font-size:17px}
.feedback {font-size:15px;padding:11px 14px;border-radius:7px;background:#e5efdf;color:#335638;margin-top:13px}
.feedback.wrong {color:#744531;background:#f5e8df}
.quiz-actions {display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn {border:1px solid #b9c6b8;background:var(--card);color:var(--deep);border-radius:6px;font-size:14px;font-weight:800;padding:7px 14px;line-height:1.75}
.btn.primary {background:var(--lake);border-color:var(--lake);color:white}
.btn:hover:not(:disabled) {filter:brightness(.96)}
.btn:disabled {opacity:.5}
.order-zone {padding:10px 12px;margin:10px 0;border:1px dashed #aab9a5;border-radius:7px;min-height:53px}
.order-zone p {color:var(--muted);font-size:14px;margin:2px}
.order-zone .option {width:100%;margin:5px 0}
.order-source {display:grid;gap:8px}
.order-source .option {width:100%}
.question-nav {display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}
.question-nav button {min-width:32px;padding:4px 7px;font-size:13px;color:var(--lake);border:1px solid #c7d1bf;background:var(--card);border-radius:4px;font-weight:700}
.question-nav .answered {background:#e2ecd9}
.question-nav button[aria-current] {outline:2px solid var(--lake);outline-offset:1px}
.score {font:900 29px/1.5 var(--serif);color:var(--deep);margin:7px 0 12px}
.review {padding:14px 0;border-bottom:1px solid var(--line)}
.review p {font-size:15px;margin:6px 0}
.review h4 {font:700 17px/1.8 var(--sans);margin-bottom:6px}
.review summary {font-size:14px;color:var(--deep);font-weight:800;cursor:pointer}
.exam-layout {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:18px;align-items:start}
.exam-text {padding:17px 20px;background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:12px}
.exam-text h3 {font-size:21px;color:var(--deep);margin:0 0 4px}
.exam-text blockquote {font:700 18px/2.1 var(--serif);white-space:pre-line;margin:10px 0 0}
.exam-text details {font-size:14px;margin-top:10px}
.exam-text summary {color:var(--deep);font-weight:700;cursor:pointer}
.exam-text dl {margin:8px 0}
.exam-text dt {font-weight:800;color:var(--seal)}
.exam-text dd {margin:0 0 8px}
.exam-panel {border:1px solid var(--line);border-radius:9px;background:#f7f8f2;padding:21px}
.exam-panel .options {grid-template-columns:1fr}
.info-card {background:var(--card);padding:23px;border:1px solid var(--line);border-radius:10px;margin-bottom:19px}
.info-card h3 {font-size:22px;color:var(--deep)}
.table-wrap {overflow-x:auto}
table {border-collapse:collapse;width:100%;font-size:15px;min-width:590px}
th,td {padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th {background:var(--pale);color:var(--deep);font-weight:800}
td {font-weight:500}
td:first-child {font-weight:700}
.note {padding:12px 16px;background:#f0e9d9;border-left:4px solid var(--gold);font-size:14px;margin:16px 0 0}
.form-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.form-grid article {background:var(--card);border:1px solid var(--line);padding:17px;border-radius:8px}
.form-grid h3 {font-size:19px;color:var(--deep)}
.form-grid p {font-size:14px;margin:0 0 8px}
footer {padding:18px 0 34px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer summary {cursor:pointer;color:var(--deep);font-weight:700}
footer p {margin:7px 0}
.skip {position:absolute;top:-80px;left:12px;padding:8px;background:white;z-index:99}
.skip:focus {top:8px}
@media(max-width:760px) {
 .wrap {width:calc(100% - 28px)}
 .hero-inner {padding:37px 0 29px}
 .hero::after {right:-30px;top:-12px}

 .reading {grid-template-columns:1fr;gap:20px}
 .reading-points {border-left:0;border-top:1px solid var(--line);padding:17px 0 0}
 .poem-header,.poem-body,.exercise {padding:19px}
 .verse {font-size:clamp(18px,4.8vw,22px);line-height:2.2}
 .options,.exam-layout,.form-grid {grid-template-columns:1fr}
 .page-heading {align-items:start}
 h2 {font-size:27px}
 .poem-header h3 {font-size:23px}
 .lead {font-size:14px}
 .summary {font-size:11px}
 .exam-panel {padding:17px}
 .question {font-size:18px}
 .form-tag {font-size:11px}
}
@media(prefers-reduced-motion:no-preference) {html {scroll-behavior:smooth}}

<header class="hero"><div class="wrap hero-inner"><p class="eyebrow">唐宋經典・詩詞補充</p><h1>湖上讀詩</h1><p class="lead">洞庭的秋月，西湖的晴雨與荷色。<br>六篇湖景詩詞，讀景物，也讀詩人的心意。</p></div></header>
<nav class="study-nav" aria-label="教材單元"><div class="wrap nav-items" id="navigation"></div></nav>
<main class="wrap" id="content" tabindex="-1"></main>
<footer><div class="wrap"><p>國中七至九年級・跨版本詩詞補充（翰林／康軒／南一）。</p><details><summary>選文與參考來源</summary><ul id="sources"></ul><p>原文採常見繁體字版本，標點依閱讀需要調整。注釋、語譯與題目為教學編寫。〈望洞庭湖贈張丞相〉末句採「徒有羨魚情」。</p></details></div></footer>
<script>
const poems = {
  dongting: {
    title:'望洞庭', author:'劉禹錫', era:'唐', lake:'洞庭湖', form:'七言絕句',
    lines:['湖光秋月兩相和，','潭面無風鏡未磨。','遙望洞庭山水翠，','白銀盤裡一青螺。'],
    notes:[['和','ㄏㄜˊ，相互調和、映襯。'],['鏡未磨','湖面像尚未磨亮的銅鏡，呈現柔和、朦朧的光澤。'],['青螺','青色的螺，這裡比喻洞庭湖中的君山。']],
    translation:'秋夜的湖光與月色相映成趣，無風的湖面像尚未磨亮的銅鏡。遠遠望去，洞庭的湖水與山色青翠，彷彿白銀盤裡放著一枚青螺。',
    points:[['以小喻大','湖面化作銀盤，湖中的山化作青螺，遼闊山水成了小巧、精緻的畫面。'],['遠望的視角','「遙望」讓君山看來小巧；理解比喻時，要把視線距離一起考慮。'],['清幽與和諧','「兩相和」「無風」配合柔和的月色，形成寧靜、協調的秋夜。']],
    url:'https://zh.wikisource.org/zh-hant/望洞庭'
  },
  meng: {
    title:'望洞庭湖贈張丞相', author:'孟浩然', era:'唐', lake:'洞庭湖', form:'五言律詩',
    lines:['八月湖水平，涵虛混太清。','氣蒸雲夢澤，波撼岳陽城。','欲濟無舟楫，端居恥聖明。','坐觀垂釣者，徒有羨魚情。'],
    notes:[['涵虛','湖水包容、映照著天空。'],['太清','天空。'],['雲夢澤','古代的大澤名稱。'],['撼','ㄏㄢˋ，搖動、震動。'],['濟','渡過。'],['舟楫','船與槳。「楫」讀 ㄐㄧˊ。'],['端居','閒居。'],['聖明','稱頌君主聖明，這裡指聖明之世。'],['羨魚','羨慕別人的收穫。結合贈詩對象，寄寓希望出仕、獲得引薦的心意。']],
    translation:'八月的湖水漲到與岸相平，水映長空，幾乎與天空連成一片。水氣蒸騰籠罩雲夢澤，波濤彷彿撼動岳陽城。我想渡湖卻缺少船槳，在聖明之世閒居感到羞愧。看著垂釣的人，只能空懷羨魚之情。',
    points:[['蒸與撼的力量','「蒸」寫水氣向上升騰，「撼」寫波濤衝擊，動詞把湖景寫得雄渾壯闊。'],['景物連到處境','前四句寫湖水，後四句接「渡湖缺舟楫」的形象，轉向自己的處境。'],['贈詩的言外之意','題目指出受贈者是丞相；「欲濟」「羨魚」寄寓希望得到引薦、施展抱負的心意。']],
    url:'https://zh.wikisource.org/zh-hant/臨洞庭上張丞相'
  },
  su: {
    title:'飲湖上初晴後雨', subtitle:'其二', author:'蘇軾', era:'宋', lake:'杭州西湖', form:'七言絕句',
    lines:['水光瀲灩晴方好，','山色空濛雨亦奇。','欲把西湖比西子，','淡妝濃抹總相宜。'],
    notes:[['瀲灩','ㄌㄧㄢˋ ㄧㄢˋ，水波映著光閃動的樣子。'],['空濛','ㄎㄨㄥ ㄇㄥˊ，煙雨迷濛的樣子。「濛」亦有作「蒙」的版本。'],['西子','西施，古代著名的美女。'],['相宜','合適、相稱。']],
    translation:'晴天的西湖波光閃耀，正是美好；下雨時山色朦朧，也別有奇趣。如果把西湖比作西施，無論淡妝或濃妝，都很相宜。',
    points:[['晴與雨都入眼','「方好」「亦奇」分別肯定晴景與雨景，寫出不同天氣各有風姿。'],['西湖比西子','用西施的美比擬西湖的美，以人的妝容變化映照湖山不同的面貌。'],['總字收束全詩','「總相宜」把前面的晴雨景色一併收進讚美，表現對西湖的欣賞。']],
    url:'https://zh.wikisource.org/zh-hant/飲湖上初晴後雨二首'
  },
  yang: {
    title:'曉出淨慈寺送林子方', author:'楊萬里', era:'宋', lake:'杭州西湖', form:'七言絕句',
    lines:['畢竟西湖六月中，','風光不與四時同。','接天蓮葉無窮碧，','映日荷花別樣紅。'],
    notes:[['畢竟','到底、終究，帶有強調的語氣。'],['四時','四季；在這首詩中，與「六月中」相對，指其他時節。'],['接天','像是連接到天邊，形容蓮葉鋪展得廣。'],['別樣','格外、特別。']],
    translation:'到底是西湖六月的時節，風光與其他時候不同。蓮葉一直鋪展到天邊，一片無盡碧綠；荷花映著日光，顯得格外鮮紅。',
    points:[['先讚嘆，後寫景','前兩句先說六月景色特別，後兩句用蓮葉、荷花的具體畫面說明。'],['廣度與色彩','「接天」「無窮」拉開空間，「碧」「紅」形成鮮明的色彩映襯。'],['詩題與詩中內容','詩題交代清晨送友；詩句著力呈現盛夏湖景，情感判斷仍要回到原文。']],
    url:'https://zh.wikisource.org/zh-hant/曉出淨慈寺送林子方'
  },
  bai: {
    title:'錢塘湖春行', author:'白居易', era:'唐', lake:'杭州西湖', form:'七言律詩',
    lines:['孤山寺北賈亭西，水面初平雲腳低。','幾處早鶯爭暖樹，誰家新燕啄春泥。','亂花漸欲迷人眼，淺草才能沒馬蹄。','最愛湖東行不足，綠楊陰裡白沙堤。'],
    notes:[['錢塘湖','杭州西湖。'],['初平','湖水剛剛漲到與岸相平。'],['暖樹','向陽的樹。'],['亂花','繁多、錯落的花。'],['沒','ㄇㄛˋ，遮沒、蓋過。'],['行不足','遊賞不夠，捨不得離開。']],
    translation:'從孤山寺北到賈亭西，湖水初漲，低垂的雲與水相接。幾處早來的黃鶯爭著停上向陽的樹，新飛來的燕子啄取春泥。繁花漸漸使人眼花撩亂，淺草才剛遮過馬蹄。我最愛湖東的風景，怎麼遊賞都不夠，尤其是綠楊陰裡的白沙堤。',
    points:[['早春的程度詞','「初」「早」「新」「漸欲」「才能」共同寫出春天剛展開的樣子。'],['邊走邊看的層次','由湖面轉到鶯燕，再看花草，最後寫到湖東的白沙堤，形成遊賞的移動感。'],['以最愛點出情意','末聯直接寫「最愛」「行不足」，把前面細看春景的欣喜收束起來。']],
    url:'https://zh.wikisource.org/zh-hant/錢塘湖春行'

function signature(q) {
  const text = JSON.stringify([q.type,q.prompt,q.options,q.answer]);
  let hash = 5381;
  for(let i=0;i<text.length;i++) hash = ((hash*33)^text.charCodeAt(i))>>>0;
  return hash.toString(36);
}
const questionChecks = Object.fromEntries(Object.entries(allQuestions).map(([id,qs])=>[id,qs.map(signature)]));
const totalQuestions = Object.values(allQuestions).reduce((sum,qs)=>sum+qs.length,0);

function newRound() {return {index:0,answers:{},submitted:false};}
for(const [id,questions] of Object.entries(allQuestions)) {
  const previous = stored[id];
  const round = newRound();
  if(previous && typeof previous==='object') {
    round.index = Number.isInteger(previous.index) && previous.index>=0 && previous.index<questions.length ? previous.index : 0;
    const checks = Array.isArray(previous.checks) ? previous.checks : [];
    for(const [key,pick] of Object.entries(previous.answers || {})) {
      const q = questions[key];
      if(!q || checks[key]!==questionChecks[id][key]) continue;
      const valid = q.type==='order' ? Array.isArray(pick) && pick.length===q.options.length && new Set(pick).size===pick.length && pick.every(n=>Number.isInteger(n)&&n>=0&&n<q.options.length) : Number.isInteger(pick)&&pick>=0&&pick<q.options.length;
      if(valid) round.answers[key]=pick;
    }
    round.submitted = previous.submitted===true && Object.keys(round.answers).length===questions.length;
  }
  rounds[id]=round;
  orderDrafts[id]=[];
}
function save() {
  const data = {};
  for(const [id,round] of Object.entries(rounds)) data[id] = {...round,checks:questionChecks[id]};
  try {localStorage.setItem(storageKey,JSON.stringify(data));} catch {}
}
function correct(q,pick) {return q.type==='order' ? Array.isArray(pick)&&q.answer.every((n,i)=>n===pick[i]) : q.answer===pick;}
function answerText(q,pick) {
  if(pick===undefined) return '未作答';
  return q.type==='order' ? pick.map(n=>q.options[n]).join(' → ') : q.options[pick];
}
function completedCount() {return Object.values(rounds).reduce((sum,round)=>sum+Object.keys(round.answers).length,0);}
function summary() {return `<div class="summary">已答 <b id="completed">${completedCount()}</b> / ${totalQuestions} 題</div>`;}
function lineMarkup(line,poemId) {
  const words = poems[poemId].notes.map(([word],index)=>({word,index})).filter(({word})=>line.includes(word)).sort((a,b)=>b.word.length-a.word.length);
  let result='';
  let offset=0;
  while(offset<line.length) {
    const found = words.find(({word})=>line.startsWith(word,offset));
    if(found) {
      result+=`<button type="button" class="word" data-word="${found.index}" data-poem="${poemId}" aria-pressed="false" aria-controls="note-${poemId}">${escapeHTML(found.word)}</button>`;
      offset+=found.word.length;
    } else {
      result+=escapeHTML(line[offset]);
      offset++;
    }
  }
  return result;
}

function resultMarkup(id) {

function optionsMarkup(id,q,pick,revealed) {
  if(q.type==='order') {
    const draft=revealed?pick:orderDrafts[id];
    const selected=draft.map((n,i)=>`<button type="button" class="option" data-action="remove" data-value="${n}" ${revealed?'disabled':''}><span class="letter">${i+1}</span><span>${escapeHTML(q.options[n])}</span></button>`).join('');
    const remaining=[2,0,1].filter(n=>!draft.includes(n));
    return `<p class="word-hint">依序點選卡片，排好後確認；點已排的卡片可移回。</p><div class="order-zone">${selected||'<p>將三張卡片排在這裡</p>'}</div><div class="order-source">${remaining.map(n=>`<button type="button" class="option" data-action="add" data-value="${n}"><span class="letter">＋</span><span>${escapeHTML(q.options[n])}</span></button>`).join('')}</div>`;
  }
  return `<div class="options ${q.type==='evidence'?'evidence':''}">${q.options.map((option,i)=>{
    const selected=pick===i;
    const state=revealed?(q.answer===i?'correct':selected?'incorrect':''):(selected?'selected':'');
    const label=revealed?(q.answer===i?'（正解）':selected?'（你的答案）':''):'';
    return `<button type="button" class="option ${state}" data-action="pick" data-value="${i}" ${revealed?'disabled':`aria-pressed="${selected}"`}><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(option)} ${label?`<small>${label}</small>`:''}</span></button>`;
  }).join('')}</div>`;
}
function quizMarkup(id) {

  const isExam=id==='exam';

  <div class="quiz-actions">
  <button type="button" class="btn" data-action="previous" ${index>0?'':'disabled'}>上一題</button>
  ${q.type==='order'&&!revealed?`<button type="button" class="btn primary" data-action="check" ${orderDrafts[id].length===3?'':'disabled'}>確認排序</button>`:''}

  ${last&&!isExam?`<button type="button" class="btn primary" data-action="finish" ${missing?'disabled':''}>看練習結果</button>`:''}

  ${last&&missing?'<button type="button" class="btn" data-action="unanswered">回到未答題</button>':''}
  </div>`;
}

  <section class="info-card"><h3>律詩的四聯</h3><div class="table-wrap"><table><thead><tr><th scope="col">聯名</th><th scope="col">句次</th><th scope="col">〈錢塘湖春行〉</th></tr></thead><tbody>
  <tr><td>首聯</td><td>第一、二句</td><td>孤山寺北賈亭西，水面初平雲腳低。</td></tr><tr><td>頷聯</td><td>第三、四句</td><td>幾處早鶯爭暖樹，誰家新燕啄春泥。</td></tr><tr><td>頸聯</td><td>第五、六句</td><td>亂花漸欲迷人眼，淺草才能沒馬蹄。</td></tr><tr><td>尾聯</td><td>第七、八句</td><td>最愛湖東行不足，綠楊陰裡白沙堤。</td></tr></tbody></table></div><p class="note">律詩的頷聯、頸聯通常要求對仗。可觀察「早鶯／新燕」「爭／啄」「暖樹／春泥」在相對位置的詞類與結構。</p></section>
  <div class="form-grid"><article><h3>用比喻寫景</h3><p>鏡、銀盤、青螺、西子、琉璃，讓湖的形貌與質感變得具體。</p><p><strong>判斷時找出被比喻的對象，以及兩者的相似點。</strong></p></article><article><h3>用字寫動靜</h3><p>「蒸、撼」寫力量，「微動、不覺」寫細小而平穩的變化。</p><p><strong>看動作的程度，再連到整體的湖景與心境。</strong></p></article><article><h3>由景讀情</h3><p>「最愛」「總相宜」直接流露欣賞，「羨魚」要結合贈詩背景。</p><p><strong>用全篇線索支持情感與主旨的判讀。</strong></p></article></div>`;
}
function renderPage(move=false) {
  const requested=location.hash.slice(1);
  if(navigation.some(([id])=>id===requested)) active=requested;
  const chapter=chapters.find(item=>item.id===active);
  if(chapter) {
    $('content').innerHTML=`<div class="page-heading"><div><h2 id="page-title" tabindex="-1">${chapter.title}</h2><p>${chapter.intro}</p></div>${summary()}</div><div class="poem-links">${chapter.poems.map(id=>`<a href="#poem-${id}" data-scroll="poem-${id}">${poems[id].title}</a>`).join('')}</div>${chapter.poems.map(poemMarkup).join('')}`;
  } else if(active==='compare') {
    $('content').innerHTML=compareMarkup();
  } else {
    $('content').innerHTML=`<div class="page-heading"><div><h2 id="page-title" tabindex="-1">綜合測驗</h2><p>12 題跨篇閱讀比較，可回看原文；交卷後顯示分數與詳解。</p></div>${summary()}</div><div class="exam-layout"><div id="exam-texts">${rounds.exam.submitted?'<div class="info-card"><h3>作答完成</h3><p>可在錯題解析裡展開原文，重新核對判斷依據。</p></div>':examTexts(exam[rounds.exam.index].source)}</div><section class="exam-panel" id="quiz-exam" data-quiz="exam" aria-label="綜合測驗">${quizMarkup('exam')}</section></div>`;
  }
  $('navigation').querySelectorAll('a').forEach(a=>{
    if(a.dataset.page===active) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  if(move) {$('content').scrollIntoView({block:'start'});$('content').focus({preventScroll:true});}
}
$('navigation').innerHTML=navigation.map(([id,title])=>`<a href="#${id}" data-page="${id}">${title}</a>`).join('');
$('sources').innerHTML=Object.values(poems).map(p=>`<li>${p.author}〈${p.title}〉　<a href="${escapeHTML(p.url)}" target="_blank" rel="noopener">原文出處</a></li>`).join('')+'<li><a href="https://dict.revised.moe.edu.tw/dictView.jsp?ID=64118" target="_blank" rel="noopener">教育部《重編國語辭典修訂本》「漣漪」</a></li><li><a href="https://zh.wikisource.org/zh-hant/文忠集_(歐陽修,_四庫全書本)/卷131" target="_blank" rel="noopener">《文忠集》西湖念語與採桑子組詞</a></li>';
$('content').addEventListener('click',event=>{
  const word=event.target.closest('button[data-word]');
  if(word) {
    const id=word.dataset.poem;
    const [term,meaning]=poems[id].notes[Number(word.dataset.word)];
    const same=word.getAttribute('aria-pressed')==='true';
    $('poem-'+id).querySelectorAll('.word').forEach(b=>b.setAttribute('aria-pressed','false'));
    word.setAttribute('aria-pressed',String(!same));
    const note=$('note-'+id);
    note.innerHTML=`<strong>${escapeHTML(term)}</strong>　${escapeHTML(meaning)}`;
    note.hidden=same;
    return;
  }
  const anchor=event.target.closest('a[data-scroll]');
  if(anchor) {event.preventDefault();$(anchor.dataset.scroll).scrollIntoView({block:'start'});return;}
  const button=event.target.closest('button[data-action]');
  if(!button||button.disabled) return;
  // 換題後短暫忽略點擊，避免連點時第二下落在新題目的選項上
  if(performance.now()<quietUntil) return;
  const id=button.closest('[data-quiz]').dataset.quiz;
  const round=rounds[id];
  const qs=allQuestions[id];
  const oldIndex=round.index;
  const {action,value}=button.dataset;
  const pick=Number(value);
  if(action==='reset'&&!round.submitted&&button.dataset.armed!=='true') {
    button.dataset.armed='true';
    button.textContent='再按一次確認';
    quietUntil=performance.now()+400;
    setTimeout(()=>{if(button.isConnected){button.dataset.armed='false';button.textContent=button.dataset.label;}},3000);
    return;
  }
  switch(action) {
    case 'pick': round.answers[round.index]=pick; break;
    case 'add': if(!orderDrafts[id].includes(pick)) orderDrafts[id].push(pick); break;
    case 'remove': orderDrafts[id]=orderDrafts[id].filter(n=>n!==pick); break;
    case 'check': if(orderDrafts[id].length===3) round.answers[round.index]=[...orderDrafts[id]]; break;
    case 'next': round.index=Math.min(round.index+1,qs.length-1); break;
    case 'previous': round.index=Math.max(round.index-1,0); break;
    case 'jump': round.index=pick; break;
    case 'unanswered': round.index=qs.findIndex((q,i)=>round.answers[i]===undefined); break;
    case 'finish': if(Object.keys(round.answers).length===qs.length) round.submitted=true; break;
    case 'reset': rounds[id]=newRound(); break;
  }
  if(oldIndex!==round.index||action==='reset') orderDrafts[id]=[];
  if(oldIndex!==round.index||action==='reset'||action==='finish') quietUntil=performance.now()+400;
  const quiz=$('quiz-'+id);
  quiz.innerHTML=quizMarkup(id);
  if(id==='exam') $('exam-texts').innerHTML=rounds.exam.submitted?'<div class="info-card"><h3>作答完成</h3><p>可在錯題解析裡展開原文，重新核對判斷依據。</p></div>':examTexts(exam[rounds.exam.index].source);
  $('completed').textContent=completedCount();
  save();
  if(action==='add'||action==='remove') {
    (quiz.querySelector('button[data-action="add"],button[data-action="check"]')||$('question-'+id)).focus({preventScroll:true});
  } else if(id==='exam'&&action==='pick') {
    quiz.querySelector(`[data-action="pick"][data-value="${pick}"]`).focus({preventScroll:true});
  } else {
    const feedback=$('feedback-'+id);
    const target=feedback&&(action==='pick'||action==='check')?feedback:$('question-'+id);
    target.focus({preventScroll:action==='pick'||action==='check'});
  }
});
window.addEventListener('hashchange',()=>renderPage(true));
renderPage(false);

</script>
